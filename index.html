<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moodroom — 통합 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1f2a; --muted:#8a8d96; --line:#e7e7ea; --bg:#ffffff; --soft:#f5f5f6; --accent:#1d1f2a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:flex;flex-direction:column;height:100vh;min-height:560px}

/* header */
header{display:flex;align-items:center;gap:20px;padding:12px 22px;border-bottom:1px solid var(--line);background:#fff;z-index:10}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.04em;font-size:15px;white-space:nowrap}
.brand svg{width:22px;height:22px}
.tabs{display:flex;align-items:center;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap;outline:none;border:1px solid transparent}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab.on{background:var(--ink);color:#fff}
.tab[contenteditable="true"]{background:#fff;color:var(--ink);border-color:var(--ink);cursor:text}
.tab.add{color:var(--muted);border:1px dashed #cfcfd4}
.hbtns{display:flex;gap:8px}
.pill{padding:7px 14px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.pill:hover{border-color:var(--ink)}
.pill.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}

main{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* arc view */
#arcView{background:#fff;overflow:hidden;cursor:grab;touch-action:pan-y}
#arcView.drag{cursor:grabbing}
.arc-wrap{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center}
.arc-scale{position:relative;width:1100px;height:660px;transform-origin:top center}
.arc-card{position:absolute;left:50%;top:0;width:140px;height:222px;transition:opacity .4s;will-change:transform}
.arc-card .inner{position:relative;width:100%;height:100%;overflow:hidden;transition:transform .3s ease;box-shadow:0 8px 24px rgba(20,22,40,.10);background:var(--soft)}
.arc-card:hover{z-index:20}
.arc-card:hover .inner{transform:translateY(-8px) scale(1.06)}
.arc-card img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
.arc-card .cap{position:absolute;left:-20px;right:-20px;top:calc(100% + 14px);text-align:center;font-size:12px;color:var(--muted);line-height:1.5;pointer-events:none}
.arc-card .cap b{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.arc-card .blank{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#b2b4bb;font-size:30px;background:var(--soft)}
.node .cov{position:absolute;left:-10px;top:-10px;width:22px;height:22px;border-radius:50%;background:#fff;color:#b2b4bb;border:1px solid var(--line);font-size:12px;line-height:20px;text-align:center;opacity:0;transition:opacity .15s}
.node:hover .cov,.node .cov.is{opacity:1}
.node .cov.is{color:var(--ink);border-color:var(--ink)}
.canvas.connect .node .cov{display:none}
.hero{position:absolute;left:50%;top:462px;transform:translateX(-50%);width:420px;text-align:center}
.hero h1{font-size:16px;font-weight:700;margin-bottom:8px}
.hero p{font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:16px}
.hero .pill{padding:8px 18px}
.arc-hint{pointer-events:none;position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:#b2b4bb}

/* board view */
#boardView{background:var(--soft)}
.toolbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;background:#fff;border:1px solid var(--line);border-radius:999px;z-index:6;box-shadow:0 4px 18px rgba(20,22,40,.06)}
.toolbar .pill{border-color:transparent;padding:6px 12px}
.toolbar .pill:hover{background:var(--soft)}
.toolbar .pill.on{background:var(--ink);color:#fff}
.toolbar .sep{width:1px;height:18px;background:var(--line);margin:0 2px}
.zoomlbl{font-size:12px;color:var(--muted);min-width:42px;text-align:center}
.canvas{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(#d9d9de 1px,transparent 1px);background-size:24px 24px}
.canvas.pan{cursor:grabbing}
.canvas.connect{cursor:crosshair}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.links line{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1 6}
.links line.hit{stroke:transparent;stroke-width:16;stroke-dasharray:none;pointer-events:none}
.canvas.connect .links line.hit{pointer-events:stroke;cursor:pointer}
.node{position:absolute;background:#fff;padding:6px;box-shadow:0 6px 20px rgba(20,22,40,.10);cursor:move;user-select:none}
.node img{display:block;width:100%;height:auto;-webkit-user-drag:none;pointer-events:none}
.canvas.connect .node{cursor:pointer}
.node.pending{outline:2px solid var(--ink);outline-offset:3px}
.node .del{position:absolute;right:-10px;top:-10px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;line-height:22px;text-align:center;opacity:0;transition:opacity .15s}
.node:hover .del{opacity:1}
.canvas.connect .node .del{display:none}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:14px;line-height:1.8;pointer-events:none}
.statusbar{position:absolute;left:18px;bottom:14px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);padding:6px 12px;border-radius:999px;border:1px solid var(--line);z-index:6}
.banner{position:absolute;right:18px;bottom:14px;max-width:340px;font-size:12px;line-height:1.6;background:#fff;border:1px solid var(--line);padding:10px 34px 10px 14px;border-radius:14px;z-index:6;box-shadow:0 4px 18px rgba(20,22,40,.08)}
.banner button{position:absolute;right:10px;top:8px;color:var(--muted);font-size:15px}

/* feed (scroll) view */
#feedView{background:#fff}
.feed-scroll{position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth}
.feed-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.feed-title{flex:1;min-width:0;text-align:center}
.feed-title h2{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-title p{font-size:12px;color:var(--muted);margin-top:2px}
.feed-list{max-width:440px;margin:0 auto;padding:40px 20px 140px;display:flex;flex-direction:column;gap:64px}
.ref{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.ref.in{opacity:1;transform:none}
.ref img{width:100%;height:auto;display:block;background:var(--soft);box-shadow:0 10px 30px rgba(20,22,40,.10)}
.ref .meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:12px;color:var(--muted)}
.ref .no{font-weight:700;color:var(--ink);letter-spacing:.08em;margin-right:4px}
.chip{padding:3px 11px;border:1px solid var(--line);border-radius:999px;background:#fff}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.ref.flash img{outline:2px solid var(--ink);outline-offset:8px}
.feed-empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.9;padding:120px 0}
.feed-empty .pill{margin-top:16px}
.feed-end{text-align:center;font-size:12px;color:#b2b4bb}
button.brand{cursor:pointer}

/* masonry feed overrides */
.feed-list{max-width:1240px;padding:28px 24px 140px;display:flex;flex-direction:row;gap:16px;align-items:flex-start}
.fcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.ref{transform:translateY(18px)}
.ref img{border-radius:12px;box-shadow:none;cursor:zoom-in;transition:transform .25s ease,box-shadow .25s ease}
.ref img:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,22,40,.16)}
.ref .meta{margin-top:8px;gap:6px;padding:0 2px}
.ref .chip{padding:1px 8px;font-size:11px}
.ref.flash img{outline:2px solid var(--ink);outline-offset:4px}
.feed-empty{width:100%}
.light{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:zoom-out;padding:24px}
.light.on{display:flex}
.light img{max-width:88vw;max-height:80vh;width:auto;height:auto;border-radius:12px;box-shadow:0 20px 60px rgba(20,22,40,.18)}
.light div{font-size:12px;color:var(--muted);letter-spacing:.08em}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(29,31,42,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:18px;padding:22px;width:min(560px,100%)}
.sheet h3{font-size:16px;margin-bottom:6px}
.sheet p{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.sheet textarea{width:100%;height:200px;border:1px solid var(--line);border-radius:12px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.dropmask{position:absolute;inset:10px;border:2px dashed var(--ink);border-radius:20px;display:none;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.7);z-index:7;pointer-events:none}
.dropmask.on{display:flex}
@media (max-width:760px){
  header{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .tabs{order:3;flex-basis:100%}
  .toolbar{flex-wrap:wrap;justify-content:center;border-radius:18px;width:calc(100% - 20px)}
  .banner{display:none}
}

.app.loading{pointer-events:none;opacity:.5}
#editorView{background:var(--soft)}
.node-editor{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--soft)}
.node-editor[hidden]{display:none}
.ref .open-search{margin-left:auto;font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:999px}
.arc-card.composition .inner{background:var(--soft);border-radius:14px}
.arc-card.composition img{object-fit:contain}
</style>
</head>
<body>
<div class="app loading">
  <header>
    <button class="brand" id="brandHome" aria-label="홈으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1d1f2a" stroke-width="1.6" stroke-linecap="round"><path d="M12 19c-3.2-1.2-4.9-3.6-5-7 2.6.5 4.4 2.1 5 4.6.6-2.5 2.4-4.1 5-4.6-.1 3.4-1.8 5.8-5 7z"/><path d="M12 15.5C10.6 13.4 10.4 10.800 12 6c1.6 4.800 1.400 7.400 0 9.500z"/><path d="M4 14.500c1.700 1.200 3.500 1.800 5.500 1.800M20 14.500c-1.700 1.200-3.500 1.800-5.500 1.800"/></svg>
      moodroom
    </button>
    <nav class="tabs" id="tabs" aria-label="보드 목록"></nav>
    <div class="hbtns">
      <button class="pill" id="btnExport">내보내기</button>
      <button class="pill" id="btnImport">불러오기</button>
      <button class="pill dark" id="btnSave">보드 저장</button>
    </div>
  </header>

  <main>
    <section class="view on" id="arcView">
      <div class="arc-wrap" id="arcWrap">
        <div class="arc-scale" id="arcScale">
          <div id="arcCards"></div>
          <div class="hero">
            <h1>한 장면에 모은 모든 보드</h1>
            <p id="heroSub"></p>
            <button class="pill dark" id="btnOpenFirst">보드 열기</button>
          </div>
        </div>
      </div>
      <div class="arc-hint">마우스를 움직이면 보드가 따라 움직여요 · 보드를 누르면 레퍼런스가 스크롤로 펼쳐집니다</div>
    </section>

    <section class="view" id="feedView">
      <div class="feed-scroll" id="feedScroll">
        <div class="feed-head">
          <button class="pill" id="fBack">← 홈</button>
          <div class="feed-title"><h2 id="fTitle"></h2><p id="fSub"></p></div>
          <button class="pill dark" id="fEdit">편집</button>
        </div>
        <div class="feed-list" id="feedList"></div>
      </div>
    </section>

    <section class="view" id="editorView" aria-label="검색 노드 편집기"></section>
<section class="view" id="boardView">
      <div class="toolbar" id="toolbar">
        <button class="pill" id="bView">← 보기</button>
        <span class="sep"></span>
        <button class="pill" id="zOut" aria-label="축소">−</button>
        <span class="zoomlbl" id="zLbl">100%</span>
        <button class="pill" id="zIn" aria-label="확대">+</button>
        <button class="pill" id="zFit">화면 맞춤</button>
        <span class="sep"></span>
        <button class="pill" id="btnConnect">노드 연결</button>
        <button class="pill" id="btnAdd">이미지 추가</button>
        <span class="sep"></span>
        <button class="pill" id="btnDelBoard">보드 삭제</button>
      </div>
      <div class="canvas" id="canvas">
        <div class="world" id="world">
          <svg class="links" id="links"></svg>
        </div>
        <div class="empty" id="empty" hidden>이미지 추가 버튼을 누르거나<br>사진을 끌어다 놓거나 Ctrl/⌘+V로 붙여 넣어 보세요.</div>
        <div class="dropmask" id="dropmask">여기에 놓으면 보드에 추가됩니다</div>
      </div>
      <div class="statusbar" id="status"></div>
      <div class="banner" id="banner">샘플 보드입니다. 이미지 추가나 드래그로 직접 채우거나, 가지고 있는 보드는 '불러오기'로 가져오세요.<button id="bannerX" aria-label="닫기">×</button></div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mTitle"></h3>
    <p id="mDesc"></p>
    <textarea id="mText" spellcheck="false"></textarea>
    <div class="row" id="mRow"></div>
  </div>
</div>
<div class="light" id="light"><img id="lightImg" alt=""><div id="lightCap"></div></div>
<div id="toast" role="status"></div>

dden>\n\u003c/div>\n\u003cdialog id=\"text-editor\" aria-labelledby=\"text-editor-label\">\u003cform id=\"text-form\">\n\u003clabel id=\"text-editor-label\" for=\"node-text\">추가할 텍스트\u003c/label>\n\u003ctextarea id=\"node-text\" required>\u003c/textarea>\n\u003cbutton id=\"cancel-text\" type=\"button\">취소\u003c/button>\u003cbutton id=\"submit-text\" type=\"submit\">노드 추가\u003c/button>\n\u003c/form>\u003c/dialog>\n\n\u003cdialog id=\"composition\" aria-labelledby=\"composition-title\">\n\u003cdiv class=\"composition-head\">\u003cb id=\"composition-title\">선택한 노드로 카드 만들기\u003c/b>\u003cbutton id=\"close-composition\" aria-label=\"닫기\">×\u003c/button>\u003c/div>\n\u003clabel>비율 \u003cselect id=\"composition-ratio\">\u003coption value=\"3:4\" selected>3:4 세로 (기본)\u003c/option>\u003coption value=\"1:1\">1:1 정사각형\u003c/option>\u003coption value=\"4:3\">4:3 가로\u003c/option>\u003coption value=\"16:9\">16:9 가로\u003c/option>\u003coption value=\"9:16\">9:16 세로\u003c/option>\u003c/select>\u003c/label>\n\u003cp id=\"composition-hint\">카드를 끌어 위치를 옮기고, 선택한 카드의 오른쪽 아래 점을 끌어 크기를 조절하세요. 사진 비율은 유지됩니다. 컬러칩을 클릭하면 상자형 / 세로 컬러보드로 바뀝니다.\u003c/p>\u003cdiv class=\"composition-preview\">\u003ccanvas id=\"composition-canvas\" aria-label=\"묶음 카드 미리보기\">\u003c/canvas>\u003c/div>\n\u003cp id=\"composition-status\" role=\"status\">\u003c/p>\n\u003cdiv class=\"composition-actions\">\u003cbutton id=\"download-composition\" disabled>PNG 저장\u003c/button>\u003cbutton id=\"insert-composition\" disabled>카드 만들기\u003c/button>\u003c/div>\n\u003c/dialog>\n\u003caside class=\"palette-panel\" id=\"palette-panel\" hidden>\n\u003ch2>팔레트 추가\u003c/h2>\n\u003cbutton id=\"wheel\" aria-label=\"색상환에서 색 선택\">\u003c/button>\u003clabel>선택 색상 \u003cinput type=\"color\" id=\"color-picker\" value=\"#a49a70\">\u003c/label>\n\u003cbutton id=\"add-color\">선택한 색 추가\u003c/button>\n\u003ctextarea id=\"agent-colors\" rows=\"3\" aria-label=\"에이전트의 HEX 코드\" placeholder=\"이미지-컬러-파레트 에이전트의 HEX 코드 붙여넣기\">\u003c/textarea>\n\u003cbutton id=\"add-agent\">코드로 팔레트 만들기\u003c/button>\n\u003c/aside>\n\u003cdiv class=\"notice\" id=\"notice\" role=\"status\">\u003c/div>\n\u003csection class=\"chat\" aria-label=\"에이전트 채팅\">\n\u003cbutton id=\"chat-toggle\" type=\"button\" aria-expanded=\"true\" aria-controls=\"chat-body\" aria-label=\"채팅 접기\" title=\"채팅 접기\">\u003cspan class=\"chat-chevron\" aria-hidden=\"true\">\u003c/span>\u003c/button>\u003cdiv class=\"chathead\">\u003cb>✦ 무드보드 에이전트\u003c/b>\u003c/div>\u003cdiv id=\"chat-body\">\n\u003cp id=\"connection\" role=\"status\">채팅에 연결하는 중입니다…\u003c/p>\n\u003cdiv id=\"webchat\">\u003c/div>\u003cdetails id=\"references\" hidden>\u003csummary id=\"reference-count\">참고 링크\u003c/summary>\u003cdiv id=\"reference-list\">\u003c/div>\u003c/details>\u003c/div>\n\u003c/section>\u003c/main>\n\u003cscript>\nconst el=id=>document.getElementById(id), stage=el('stage'),view=el('view');\n\nconst chatToggle = el('chat-toggle');\nconst chatBody = el('chat-body');\nchatToggle.onclick = () => {\n  const collapsed = !chatBody.hidden;\n  chatBody.hidden = collapsed;\n  chatBody.closest('.chat').classList.toggle('collapsed', collapsed);\n  chatToggle.setAttribute('aria-expanded', String(!collapsed));\n  chatToggle.setAttribute('aria-label', collapsed ? '채팅 펼치기' : '채팅 접기');\n  chatToggle.title = collapsed ? '채팅 펼치기' : '채팅 접기';\n  // 채팅 DOM을 유지해 대화와 작성 중인 입력을 보존합니다.\n};\nconst palette=['#ddc8a3','#a49a70','#656d47','#b66b52','#e9dfc9'];\nconst catalog=[\n{type:'이미지',title:'겹쳐 붙인 종이',desc:'찢어진 가장자리 · 빈티지 · 질감',art:'art',url:'https://www.metmuseum.org/art/collection/search?q=paper%20collage'},\n{type:'이미지',title:'유기적인 형태',desc:'종이 콜라주 · 추상 · 올리브',art:'art alt',url:'https://www.tate.org.uk/art/art-terms/c/collage'},\n{type:'글',title:'콜라주 기법',desc:'종이 조각을 재배치해 만드는 시각적 구성',url:'https://www.tate.org.uk/art/art-terms/c/collage'},\n{type:'영상',title:'컷아웃 애니메이션',desc:'종이 · 움직임 · 레이어',url:'https://www.youtube.com/results?search_query=cutout+animation+paper+collage'},\n{type:'팔레트',title:'따뜻한 종이 톤',desc:'베이지 · 올리브 · 테라코타',colors:palette}];\nlet cards=[{id:0,x:400,y:153,type:'탐색 키워드',title:'Paper collage',desc:'종이 콜라주',root:true},...catalog.filter((_,i)=>i!==3).map((c,i)=>({...c,id:i+1,x:[104,681,695,116][i],y:[44,31,277,288][i]}))], edges=[[0,1],[0,2],[0,3],[0,4]], next=5;\ntry{const saved=window.parent===window?JSON.parse(localStorage.getItem('moodroom')):null;if(saved){({cards,edges,next}=saved)}}catch{}\nlet scale=1,panX=0,panY=0, drag=null,timer;\nfunction notify(msg){el('notice').textContent=msg;clearTimeout(timer);timer=setTimeout(()=>el('notice').textContent='',4300)}\nfunction transform(){stage.style.transform='translate(calc(-50% + '+panX+'px),calc(-50% + '+panY+'px)) scale('+scale+')';el('zoom').textContent=Math.round(scale*100)+'%'}\nfunction fit(){scale=Math.min(1,view.clientWidth/920,Math.max(.3,(view.clientHeight-330)/440));panX=panY=0;transform()}\nfunction lines(){el('lines').replaceChildren(...edges.map(([a,b])=>{const first=cards.find(c=>c.id===a),second=cards.find(c=>c.id===b);const p=document.createElementNS('http://www.w3.org/2000/svg','path');const x=first.x+(first.root?95:107),y=first.y+52,u=second.x+107,v=second.y+52,m=(x+u)/2;p.setAttribute('d','M'+x+' '+y+' C'+m+' '+y+' '+m+' '+v+' '+u+' '+v);p.setAttribute('stroke','#1d1f2a');p.setAttribute('stroke-width','2');p.setAttribute('fill','none');return p}))}\nfunction make(tag,content,cls){const node=document.createElement(tag);node.textContent=content||'';if(cls)node.className=cls;return node}\nfunction render(){stage.querySelectorAll('.card').forEach(c=>c.remove());for(const c of cards){const box=make('article','','card'+(c.root?' root':'')+(chosen.has(c.id)?' selected':''));box.dataset.id=c.id;if(c.type==='키워드')box.dataset.text='';if(c.composite)box.dataset.composite='';box.style.left=c.x+'px';box.style.top=c.y+'px';box.append(make('div',c.type,'type'));if(c.queryTags?.length)box.append(make('div',c.queryTags.map(tag=>'#'+String(tag).replace(/^#/, '')).join(' '),'result-tags'));if(c.art)box.append(make('div','',c.art));if(c.image){const img=make('img');img.draggable=false;img.src=c.image;img.alt=c.title;img.onload=lines;img.onerror=()=>{img.classList.add('failed');const warning=make('p','이미지를 불러오지 못했어요. 원본 출처를 확인해 주세요.');img.after(warning);lines()};box.append(img)}\nif(c.colors){\n  const sw=make('div','','swatches');\n  sw.style.setProperty('--chip-columns',String(Math.min(3,c.colors.length)));\n  sw.style.setProperty('--color-count',String(c.colors.length));\n  box.dataset.palette='';\n  box.dataset.colorLayout=c.colorLayout==='bars'?'bars':'boxes';\n  for(const col of c.colors){\n    const unit=make('div','','swatch-unit');\n    const button=make('button','','swatch-color');\n    button.style.background=col;\n    button.title='클릭하면 상자형 / 세로 컬러보드 전환';\n    button.setAttribute('aria-label',col+' 모양 전환');\n    button.onkeydown=event=>{\n      if(event.key==='Enter'||event.key===' '){\n        event.preventDefault();event.stopPropagation();\n        togglePaletteLayout(c);render();\n      }\n    };\n    unit.append(button,make('span',col,'swatch-code'));\n    sw.append(unit);\n  }\n  const search=make('button','색으로 검색','palette-search');\n  search.onclick=()=>searchColors(c);\n  box.append(sw,search);\n}\nbox.append(make('h2',c.title),make('p',c.desc));if(c.url){const a=make('a',c.type==='영상'?'관련 영상 검색 ↗':'참고 출처 ↗');a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';box.append(a)}if(c.pending){const accept=make('button','수락'),drop=make('button','삭제');accept.onclick=()=>{c.pending=false;render()};drop.onclick=()=>{cards=cards.filter(k=>k.id!==c.id);edges=edges.filter(pair=>!pair.includes(c.id));render()};box.append(accept,drop)}box.onpointerdown=e=>{if(e.target.closest('a,button')&&!e.target.closest('.swatches'))return;e.stopPropagation();start(e,c,box)};if(c.search){const refresh=make('button','↻ 연결 정보로 검색');refresh.onclick=()=>searchColors(c);box.append(refresh)}stage.append(box)}lines()}\nfunction start(e,c,box){if(e.button!==0||paletteMerging)return;view.setPointerCapture(e.pointerId);drag={c,box,x:e.clientX,y:e.clientY,ox:c?c.x:panX,oy:c?c.y:panY,moved:false,colorFace:!!e.target.closest('.swatch-color')}}\nview.onpointerdown=e=>{if(!e.target.closest('.card'))start(e)};\nview.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(!drag.moved)return;if(drag.c){drag.c.x=drag.ox+dx/scale;drag.c.y=drag.oy+dy/scale;drag.box.style.left=drag.c.x+'px';drag.box.style.top=drag.c.y+'px';lines()}else{panX=drag.ox+dx;panY=drag.oy+dy;transform()}};\nview.onpointercancel=()=>drag=null;\n\nview.onpointerup = event => {\n  const finished = drag;\n  drag = null;\n  if (!finished) return;\n  if (finished.moved) {\n    mergePalette(finished, event);\n    return;\n  }\n\n  if(finished.c?.colors&&finished.colorFace){\n    togglePaletteLayout(finished.c);\n    chosen.add(finished.c.id);\n    render();\n  }\n  else if (finished.c) chooseNode(finished.c.id);\n  else {\n    chosen.clear();\n    refreshSelection();\n  }\n};\n\nfunction selectedConnection(){\n  if(chosen.size!==2)return false;\n  const [a,b]=[...chosen];\n  return edges.some(([from,to])=>(from===a&&to===b)||(from===b&&to===a));\n}\nel('link').onclick=()=>{\n  const ids=[...chosen].filter(id=>cards.some(card=>card.id===id));\n  if(ids.length\u003c2)return;\n  if(selectedConnection()){\n    const [a,b]=ids;\n    edges=edges.filter(([from,to])=>!((from===a&&to===b)||(from===b&&to===a)));\n    render();\n    notify('두 노드의 연결을 해제했어요.');\n    return;\n  }\n  const anchor=ids[0];\n  for(const id of ids.slice(1)){\n    if(!edges.some(pair=>pair.includes(anchor)&&pair.includes(id)))edges.push([anchor,id]);\n  }\n  render();\n  notify('선택한 노드를 연결했어요.');\n};\nfunction zoom(by){scale=Math.min(2,Math.max(.25,scale+by));transform()}\nel('plus').onclick=()=>zoom(.1);el('minus').onclick=()=>zoom(-.1);el('fit').onclick=fit;view.onwheel=e=>{e.preventDefault();zoom(e.deltaY\u003c0?.07:-.07)};window.addEventListener('resize',fit);\nel('save').onclick=()=>{try{localStorage.setItem('moodroom',JSON.stringify({cards,edges,next}));notify('이 브라우저에 보드를 저장했어요.')}catch{notify('저장 공간이 부족해 보드를 저장하지 못했어요.')}};\nconst palettePanel=el('palette-panel');\nel('palette-toggle').onclick=()=>{\n  palettePanel.hidden=!palettePanel.hidden;\n  el('palette-toggle').setAttribute('aria-expanded',String(!palettePanel.hidden));\n};\nfunction readColors(value){\n  return [...new Set((value.match(/#[0-9a-f]{6}(?![a-z0-9])|#[0-9a-f]{3}(?![a-z0-9])/gi)||[]).map(hex=>{\n    hex=hex.toUpperCase();\n    return hex.length===4?'#'+[...hex.slice(1)].map(c=>c+c).join(''):hex;\n  }))];\n}\nfunction addPalette(colors,title){\n  if(!colors.length){notify('HEX 코드(예: #A49A70)를 입력해 주세요.');return}\n  cards.push({id:next++,x:500-panX/scale-47,y:220-panY/scale-55,type:'팔레트',title,desc:'다른 팔레트에 끌어 놓으면 합쳐져요.',colors});\n  palettePanel.hidden=true;\n  el('palette-toggle').setAttribute('aria-expanded','false');\n  render();\n}\nel('wheel').onclick=event=>{\n  if(!event.detail){el('color-picker').click();return}\n  const bounds=event.currentTarget.getBoundingClientRect();\n  const hue=(Math.atan2(event.clientX-bounds.left-bounds.width/2,bounds.top+bounds.height/2-event.clientY)*180/Math.PI+360)%360;\n  const channel=n=>{\n    const k=(n+hue/30)%12;\n    return Math.round(255*(.5-.5*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0');\n  };\n  el('color-picker').value='#'+channel(0)+channel(8)+channel(4);\n};\nel('add-color').onclick=()=>addPalette(readColors(el('color-picker').value),'선택한 색');\nel('add-agent').onclick=()=>addColorChips(readColors(el('agent-colors').value));\nasync function mergePalette(d,event){\n  if(!d.c?.colors||paletteMerging)return;\n  const source=d.c;\n  const target=[...stage.querySelectorAll('.card')].reverse().map(box=>({box,card:cards.find(c=>c.id===Number(box.dataset.id))})).find(({box,card})=>{\n    if(!card?.colors||card.id===source.id)return false;\n    const r=box.getBoundingClientRect();\n    const s=d.box.getBoundingClientRect(),snap=12*scale;return s.left\u003c=r.right+snap&&s.right>=r.left-snap&&s.top\u003c=r.bottom+snap&&s.bottom>=r.top-snap;\n  })?.card;\n  if(!target)return;\n  await animatePaletteMerge(d.box, stage.querySelector('[data-id=\"'+target.id+'\"]'), source, target);\n  if(!cards.includes(source)||!cards.includes(target))return;\n  target.colors=readColors([...target.colors,...source.colors].join(' '));\n  cards=cards.filter(c=>c.id!==source.id);\n  const seen=new Set();\n  edges=edges.map(pair=>pair.map(id=>id===source.id?target.id:id)).filter(([a,b])=>{\n    const key=[Math.min(a,b),Math.max(a,b)].join(':');\n    if(a===b||seen.has(key))return false;\n    seen.add(key);\n    return true;\n  });\n  if(chosen.delete(source.id))chosen.add(target.id);\n  render();\n  const mergedBox=stage.querySelector('[data-id=\"'+target.id+'\"]');\n  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){\n    mergedBox.animate([{transform:'scale(.98)',borderRadius:'24px'},{transform:'scale(1)',borderRadius:'30px'}],\n      {duration:140,easing:'ease-out'});\n  }\n  notify('팔레트를 합쳤어요.');\n}\nlet directLine;\n\nfunction collectConnected(id){\n  const visited=new Set([id]),queue=[id];\n  for(let index=0;index\u003cqueue.length;index++){\n    for(const [a,b] of edges){\n      const neighbor=a===queue[index]?b:b===queue[index]?a:null;\n      if(neighbor!==null&&!visited.has(neighbor)){visited.add(neighbor);queue.push(neighbor)}\n    }\n  }\n  return cards.filter(c=>visited.has(c.id)&&!c.search).map(c=>({\n    id:c.id,type:c.type,title:c.title,keywords:c.keywords?.length?c.keywords:(c.desc||''),description:c.desc||'',colors:c.colors||[],source:c.url||'',imageUrl:safeImageUrl(c.image),contents:c.sourceNodes||[]\n  }));\n}\n\nfunction searchColors(card){\n  if(!directLine){notify('에이전트 채팅 연결을 확인해 주세요.');return}\n  const nodes=collectConnected(card.id);\n  if(!nodes.length){notify('검색 노드에 참고 노드를 연결하세요.');return}\n  const requestId=crypto.random function mk(name,list,links){
  var cards=list.map(function(a){return {id:uid(),src:a[0],x:a[1],y:a[2],w:a[3]||170}});
  var lk=(links||[]).map(function(p){return [cards[p[0]].id,cards[p[1]].id]});
  return {id:uid(),name:name,cards:cards,links:lk,view:null};
}

function load(){
  try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&s.boards&&s.boards.length)return s}}catch(e){}
  return null;
}
var state=load()||defaults();
state.cur='all';state.mode='view';
var saveTimer=null;
function persist(){
  var snapshot=structuredClone(state);
  storageQueue=storageQueue.catch(function(){}).then(async function(){
    try{await writeDatabase(snapshot);return true}
    catch(e){try{localStorage.setItem(KEY,JSON.stringify(snapshot));return true}catch(f){return false}}
  });

function renderArc(){
  var items=state.boards.map(function(bd){

    return {src:bd.pinnedThumbnail||(c?c.src:null),composition:!!bd.pinnedThumbnail||!!(c&&c.composition),bid:bd.id,bname:bd.name,count:bd.cards.length};
  });
  arcItems=items;
  STEP=items.length<=4?21:items.length<=6?17:14;
  var host=$('arcCards');host.innerHTML='';
  items.forEach(function(it,i){
    var d=document.createElement('div');d.className='arc-card'+(it.composition?' composition':'');
    var inner=document.createElement('div');inner.className='inner';

}
function startArcLoop(){
  if(arcRAF)return;
  (function tick(){
    if(state.cur!=='all'){arcRAF=0;return}
    var tx=arcBase+(calm?0:arcMX*0.85), ty=0;
    var dx=tx-arcOff, dy=ty-arcPY;
    if(Math.abs(dx)>0.0008||Math.abs(dy)>0.02){
      arcOff+=dx*0.09;arcPY+=dy*0.09;placeArc();
    }

  })();
}
function placeArc(){
  var n=arcItems.length;
  arcItems.forEach(function(it,i){
    var a=(i-arcOff)*STEP, rad=a*Math.PI/180;
    var x=R*Math.sin(rad), y=ORIGIN_Y-R*Math.cos(rad);

    y+=arcPY*(0.5+depth);
    it.el.style.transform='translate('+(x-70)+'px,'+(y-111)+'px) rotate('+a+'deg)';
    it.el.style.opacity=far?0:1;

(function arcInput(){

  v.addEventListener('wheel',function(e){
    e.preventDefault();

        var m=560,s=Math.min(1,m/Math.max(im.width,im.height));
        var cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',.84));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function addFiles(files,at){
  var b=board();if(!b)return;
  var list=Array.prototype.filter.call(files,function(f){return /^image\//.test(f.type)});
  if(!list.length){toast('이미지 파일만 추가할 수 있어요');return}
  var cw=canvas.clientWidth,ch=canvas.clientHeight;
  var cx=at?at.x:(cw/2-view.x)/view.z, cy=at?at.y:(ch/2-view.y)/view.z;
  var jobs=list.map(function(f,i){
    return shrink(f).then(function(src){
      var c={id:uid(),src:src,x:cx-85+i*30+(Math.random()*40-20),y:cy-120+i*30+(Math.random()*40-20),w:170};
      b.cards.push(c);addNodeEl(c);
    });
  });
  Promise.all(jobs).then(function(){
    $('empty').hidden=true;refreshStars();updateStatus();autosave();toast(list.length+'장을 추가했어요');
    if(b.cards.length===list.length)setTimeout(fitView,60);
  }).catch(function(){toast('이미지를 읽지 못했어요')});
}
var lastPt=null;
canvas.addEventListener('pointermove',function(e){

  lastPt={x:(e.clientX-r.left-view.x)/view.z,y:(e.clientY-r.top-view.y)/view.z};
});
canvas.addEventListener('pointerleave',function(){lastPt=null});
function addToFeed(files,b){
  var made=[];
  var jobs=files.map(function(f){
    return shrink(f).then(function(src){
      var n=b.cards.length;
      var c={id:uid(),src:src,x:60+(n%4)*230,y:60+Math.floor(n/4)*260,w:170};
      b.cards.push(c);made.push(c);
    });
  });
  Promise.all(jobs).then(function(){
    autosave();renderFeed(made.length?made[made.length-1].id:null);
    toast(made.length+'장을 붙여 넣었어요');
  }).catch(function(){toast('이미지를 읽지 못했어요')});
}
window.addEventListener('paste',function(e){
  var t=e.target;
  if($('modal').classList.contains('on'))return;
  if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;
  var files=[],items=(e.clipboardData&&e.clipboardData.items)||[];
  for(var i=0;i<items.length;i++){
    if(items[i].kind==='file'&&/^image\//.test(items[i].type)){var f=items[i].getAsFile();if(f)files.push(f)}
  }
  if(!files.length)return;
  e.preventDefault();
  var b=board();
  if(state.cur==='all'||!b){toast('보드를 먼저 열고 붙여 넣어 주세요');return}
  if(state.mode==='edit'){toast('편집 화면 안에서 이미지를 붙여 넣어 주세요')}else addToFeed(files,b);
});

$('btnImport').onclick=function(){
  openModal('보드 불러오기','내보내기로 복사해 둔 내용을 붙여 넣으세요. 현재 보드 뒤에 추가됩니다.','',[
    {label:'취소',fn:closeModal},
    {label:'불러오기',dark:true,fn:function(){
      try{
        var d=JSON.parse($('mText').value);
        if(!d||!Array.isArray(d.boards))throw 0;
        var n=0;
        d.boards.forEach(function(b){
          if(!b||!Array.isArray(b.cards))return;
          var idMap={},cards=b.cards.filter(function(c){return c&&typeof c.src==='string'&&/^data:image\//.test(c.src)}).map(function(c){
            var id=uid();idMap[c.id]=id;
            return {id:id,src:c.src,x:+c.x||0,y:+c.y||0,w:+c.w||170,title:c.title||'',description:c.description||'',composition:!!c.composition,editorCardId:c.editorCardId,sourceNodes:c.sourceNodes||[]};
          });
          var links=(b.links||[]).filter(function(l){return idMap[l[0]]&&idMap[l[1]]}).map(function(l){return [idMap[l[0]],idMap[l[1]]]});
          state.boards.push({id:uid(),name:String(b.name||'불러온 보드').slice(0,24),cards:cards,links:links,view:null,cover:idMap[b.cover]||null,pinnedThumbnail:typeof b.pinnedThumbnail==='string'&&b.pinnedThumbnail.startsWith('data:image/png;base64,')?b.pinnedThumbnail:null,editorState:b.editorState&&Array.isArray(b.editorState.cards)&&Array.isArray(b.editorState.edges)?b.editorState:null});n++;
        });
        if(!n)throw 0;
        state.sample=false;autosave();closeModal();route();toast('보드 '+n+'개를 불러왔어요');
      }catch(e){toast('형식이 맞지 않아요. 내보내기로 복사한 내용인지 확인해 주세요')}
    }}
  ]);
};

var editorFrames=new Map();
var boardRevisions=new Map();
var acceptedTransfers=new Set();
var storageQueue=Promise.resolve();
var databasePromise=null;

function database(){
  if(!databasePromise){
    databasePromise=new Promise(function(resolve,reject){
      var request=indexedDB.open('moodroom-integrated',1);
      request.onupgradeneeded=function(){request.result.createObjectStore('state')};
      request.onsuccess=function(){resolve(request.result)};
      request.onerror=function(){reject(request.error)};
    });
  }
  return databasePromise;
}
async function readDatabase(){
  var db=await database();
  return new Promise(function(resolve,reject){
    var transaction=db.transaction('state','readonly');
    var request=transaction.objectStore('state').get(KEY);
    request.onsuccess=function(){resolve(request.result||null)};
    request.onerror=function(){reject(request.error)};
  });
}
async function writeDatabase(snapshot){
  var db=await database();
  return new Promise(function(resolve,reject){
    var transaction=db.transaction('state','readwrite');
    transaction.objectStore('state').put(snapshot,KEY);
    transaction.oncomplete=function(){resolve(true)};
    transaction.onerror=function(){reject(transaction.error)};
    transaction.onabort=function(){reject(transaction.error)};
  });
}
function seedEditor(b){
  if(b.editorState)return b.editorState;
  var ids=new Map();
  var nodes=b.cards.map(function(card,index){
    ids.set(card.id,index);
    return {id:index,x:card.x||70+(index%3)*235,y:card.y||100+Math.floor(index/3)*250,
      type:'이미지',title:card.title||'레퍼런스 '+(index+1),desc:card.description||'',
      image:card.src,composite:!!card.composition,sourceNodes:card.sourceNodes||[]};
  });
  nodes.push({id:nodes.length,x:360,y:30,type:'검색',title:b.name+' 검색',
    desc:'참고 노드를 선택해 연결한 뒤 검색하세요.',search:true});
  return {cards:nodes,edges:b.links.filter(function(pair){return ids.has(pair[0])&&ids.has(pair[1])})
    .map(function(pair){return [ids.get(pair[0]),ids.get(pair[1])]}),next:nodes.length};
}
function sendEditor(frame,type,payload){
  frame.contentWindow.postMessage(Object.assign({channel:'moodroom-host-v1',type:type},payload),'*');
}
function openNodeEditor(b){
  editorFrames.forEach(function(frame,id){frame.hidden=id!==b.id});
  var frame=editorFrames.get(b.id);
  if(!frame){
    frame=document.createElement('iframe');
    frame.className='node-editor';
    frame.title=b.name+' 검색 노드 편집';
    frame.dataset.boardId=b.id;
    editorFrames.set(b.id,frame);
    $('editorView').appendChild(frame);
    frame.srcdoc=JSON.parse($('editor-document').textContent);
  }
  frame.hidden=false;
}
function acceptSnapshot(b,message){
  if(!message.snapshot||!Array.isArray(message.snapshot.cards)||!Array.isArray(message.snapshot.edges))return;
  var previous=boardRevisions.get(b.id)||0;
  if((message.revision||0)<previous)return;
  boardRevisions.set(b.id,message.revision||0);
  b.editorState=message.snapshot;
}
window.addEventListener('message',async function(event){
  var message=event.data;
  if(!message||message.channel!=='moodroom-editor-v1')return;
  var entry=Array.from(editorFrames.entries()).find(function(pair){return pair[1].contentWindow===event.source});
  if(!entry)return;
  var id=entry[0],frame=entry[1];
  var b=state.boards.find(function(item){return item.id===id});
  if(!b)return;
  if(message.type==='ready'){
    sendEditor(frame,'init',{boardId:id,name:b.name,snapshot:seedEditor(b)});
    return;
  }
  if(message.boardId!==id)return;
  acceptSnapshot(b,message);
  if(message.type==='pin-thumbnail'){
    if(typeof message.src!=='string'||!message.src.startsWith('data:image/png;base64,'))return;
    b.pinnedThumbnail=message.src;
    var pinned=await persist();
    toast(pinned?'홈 썸네일을 고정했어요. 새 이미지를 추가해도 유지됩니다.':'썸네일 저장에 실패했어요.');
    if(pinned)go('all','view');
    return;
  }
  if(message.type==='snapshot'){autosave();return}
  if(message.type==='save'){
    var saved=await persist();
    sendEditor(frame,'saved',{boardId:id,ok:saved});
    toast(saved?'검색 노드까지 저장했어요':'저장하지 못했어요. 내보내기로 복사해 주세요.');
    return;
  }
  if(message.type==='back'){
    autosave();go(id,'view');return;
  }
  if(message.type==='add-cards'){
    var transferKey=id+':'+message.transferId;
    if(acceptedTransfers.has(transferKey)){
      sendEditor(frame,'added',{boardId:id,transferId:message.transferId,ok:true});return;
    }
    var items=(message.items||[]).filter(function(item){
      return item&&typeof item.src==='string'&&item.src.startsWith('data:image/png;base64,');
    });
    if(!items.length){
      sendEditor(frame,'added',{boardId:id,transferId:message.transferId,ok:false});return;
    }
    var added=[];
    items.forEach(function(item){
      var existing=b.cards.find(function(card){return card.editorCardId===item.editorCardId});
      if(existing){
        existing.src=item.src;existing.description=item.description;added.push(existing);
      }else{
        var card={id:uid(),src:item.src,x:70+(b.cards.length%4)*235,
          y:80+Math.floor(b.cards.length/4)*260,w:220,title:item.title||'무드보드 카드',
          description:item.description||'',composition:true,editorCardId:item.editorCardId,
          sourceNodes:item.sourceNodes||[]};
        b.cards.push(card);added.push(card);
      }
    });
    b.cover=added[added.length-1].id;
    state.sample=false;
    var ok=await persist();
    if(ok)acceptedTransfers.add(transferKey);
    sendEditor(frame,'added',{boardId:id,transferId:message.transferId,ok:ok});
    if(ok){
      go(id,'view',added[added.length-1].id);
      toast('무드보드에 '+added.length+'개 추가했어요. 홈 썸네일도 갱신됐어요.');
    }else toast('저장 공간을 사용할 수 없어요. 내보내기로 보관해 주세요.');
  }
});
$('btnSave').onclick=async function(){
  var ok=await persist();
  toast(ok?'검색 노드와 무드보드를 저장했어요':'저장하지 못했어요. 내보내기를 이용해 주세요.');
};
async function bootIntegrated(){
  try{
    var stored=await readDatabase();
    if(stored&&Array.isArray(stored.boards)&&stored.boards.length)state=stored;
  }catch{}
  state.cur='all';state.mode='view';
  document.querySelector('.app').classList.remove('loading');
  route();
}
function attachImageMenu(container,b,card){
  var menu=document.createElement('details');menu.style.position='relative';menu.style.marginLeft='auto';
  var toggle=document.createElement('summary');toggle.textContent='⋯';toggle.title='이미지 메뉴';toggle.style.cursor='pointer';toggle.style.fontSize='22px';
  var actions=document.createElement('div');actions.style.cssText='position:absolute;right:0;bottom:100%;z-index:10;padding:8px;background:white;border:1px solid #e7e7ea;border-radius:12px;box-shadow:0 4px 16px #0002;min-width:150px';
  var replace=document.createElement('button');replace.className='pill';replace.textContent='이미지 교체';
  replace.onclick=function(){
    var input=document.createElement('input');input.type='file';input.accept='image/*';
    input.onchange=async function(){
      if(!input.files[0])return;
      try{card.src=await shrink(input.files[0]);autosave();renderFeed(card.id);toast('이미지를 교체했어요.')}catch{toast('이미지를 읽지 못했어요.')}
    };input.click();menu.open=false;
  };
  var remove=document.createElement('button');remove.className='pill';remove.textContent='삭제';
  remove.onclick=function(){
    b.cards=b.cards.filter(function(item){return item.id!==card.id});
    b.links=b.links.filter(function(pair){return !pair.includes(card.id)});
    if(b.cover===card.id)b.cover=null;
    autosave();renderFeed();toast('무드보드에서 삭제했어요. 검색 노드 원본은 유지됩니다.');
  };
  actions.append(replace,remove);menu.append(toggle,actions);container.appendChild(menu);
}
window.addEventListener('paste',function(event){
  if(state.mode==='edit'||state.cur==='all')return;
  if(event.target.closest?.('input,textarea,[contenteditable="true"]'))return;
  var clipboard=event.clipboardData;if(!clipboard)return;
  if(Array.from(clipboard.items||[]).some(function(item){return item.kind==='file'&&item.type.startsWith('image/')}))return;
  var doc=new DOMParser().parseFromString(clipboard.getData('text/html'),'text/html');
  var urls=Array.from(doc.querySelectorAll('img')).map(function(img){return img.getAttribute('src')});
  var plain=clipboard.getData('text/plain').trim();
  if(!urls.length&&/^https?:\/\/\S+\.(png|jpe?g|gif|webp|avif)(?:[?#]\S*)?$/i.test(plain))urls.push(plain);
  urls=Array.from(new Set(urls.filter(function(url){return /^https?:\/\//i.test(url||'')})));
  if(!urls.length)return;
  var b=board();if(!b)return;event.preventDefault();
  urls.forEach(function(src){b.cards.push({id:uid(),src:src,x:60,y:60,w:170})});
  autosave();renderFeed();toast(urls.length+'개 이미지를 붙여 넣었어요.');
});

window.addEventListener('resize',function(){if(state.cur==='all')fitArc()});
bootIntegrated();
