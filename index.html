<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moodroom — 노드형 무드보드</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #282821;
      background: #f3f2ec;
      font: 14px/1.5 "Malgun Gothic", sans-serif;
    }

    button, input, textarea, select { font: inherit; }

    button {
      padding: 9px 13px;
      border: 0;
      border-radius: 12px;
      color: inherit;
      background: #f2f1ec;
      cursor: pointer;
    }

    button:hover { background: #e6e7d5; }
    button:disabled { opacity: .45; cursor: default; }

    button:focus-visible {
      outline: 3px solid #6c956f;
      outline-offset: 3px;
    }

    header {
      height: 67px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #e7e6df;
    }

    .logo {
      font: bold 26px Georgia, serif;
      letter-spacing: -1px;
    }

    .logo i { color: #808d51; font-style: normal; }
    .top { display: flex; gap: 10px; align-items: center; }
    .top span { color: #77776b; }

    main {
      position: relative;
      height: calc(100dvh - 67px);
      min-height: 690px;
      overflow: hidden;
      background-image: radial-gradient(#d4d2c5 1px, transparent 1px);
      background-size: 19px 19px;
    }

    .heading {
      position: absolute;
      z-index: 2;
      top: 22px;
      left: 26px;
      padding: 12px 17px;
      background: #fdfcf8;
      border: 1px solid #e5e3d8;
      border-radius: 17px;
      pointer-events: none;
    }

    .heading b { font-size: 15px; }
    .heading small { display: block; color: #77776b; }

    .viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    .stage {
      position: absolute;
      width: 1000px;
      height: 440px;
      left: 50%;
      top: 35%;
      transform-origin: center;
    }

    .lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .card {
      position: absolute;
      width: 214px;
      padding: 11px;
      border: 1px solid #e4e1d6;
      border-radius: 19px;
      background: #fff;
      box-shadow: 0 8px 22px #39351e12;
      cursor: move;
      user-select: none;
    }

    .card.selected, .card:focus-visible {
      outline: 3px solid #8061ac;
    }

    .card .type {
      margin-bottom: 7px;
      color: #666e46;
      font-size: 11px;
      font-weight: bold;
    }

    .card h2 {
      margin: 8px 0 3px;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card p {
      margin: 0 0 8px;
      color: #69695e;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 11px;
      object-fit: contain;
    }

    .card img.failed { display: none; }
    .card a { color: #596443; font-size: 11px; }

    .root { width: 190px; padding: 18px; background: #e5e9d3; }
    .root h2 { margin: 4px 0 8px; font: 27px Georgia, serif; }

    .art {
      width: 100%;
      height: 111px;
      border-radius: 11px;
      background:
        linear-gradient(125deg, transparent 45%, #596442 46% 63%, transparent 64%),
        linear-gradient(32deg, #b65b43 33%, transparent 34%),
        linear-gradient(145deg, #dfc598 55%, #9f9369 56%);
    }

    .art.alt {
      background:
        radial-gradient(ellipse at 68% 65%, #b2654e 0 20%, transparent 21%),
        linear-gradient(145deg, #536044 35%, #b9a97d 36% 65%, #e9d9b7 66%);
    }

    .card[data-text] {
      width: max-content;
      max-width: 320px;
      padding: 16px;
      background: #fff;
    }

    .card[data-text] .type,
    .card[data-text] p { display: none; }

    .card[data-text] h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
    }

    .card[data-palette] {
      width: auto;
      padding: 10px;
      border-radius: 18px;
      background: #fff;
    }

    .card[data-palette] .type,
    .card[data-palette] h2,
    .card[data-palette] p { display: none; }

    .swatches {
      display: grid;
      grid-template-columns: repeat(var(--chip-columns), 72px);
      gap: 8px;
    }

    .swatch-unit { width: 72px; text-align: center; }

    .swatch-color {
      display: block;
      width: 72px;
      height: 72px;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 12px;
      cursor: grab;
    }

    .swatch-code {
      display: block;
      height: 24px;
      color: #41483a;
      font: 11px/24px monospace;
    }

    .card[data-color-layout="bars"] .swatches {
      grid-template-columns: repeat(var(--color-count), 64px);
      gap: 0;
    }

    .card[data-color-layout="bars"] .swatch-unit { width: 64px; }

    .card[data-color-layout="bars"] .swatch-color {
      width: 64px;
      height: 160px;
      border-radius: 0;
    }

    .card[data-color-layout="bars"] .swatch-unit:first-child .swatch-color {
      border-radius: 12px 0 0 12px;
    }

    .card[data-color-layout="bars"] .swatch-unit:last-child .swatch-color {
      border-radius: 0 12px 12px 0;
    }

    .card[data-color-layout="bars"] .swatch-unit:only-child .swatch-color {
      border-radius: 12px;
    }

    .palette-search {
      display: block;
      margin: 3px auto 0;
      padding: 5px 7px;
      font-size: 11px;
    }

    .card.merging { pointer-events: none; z-index: 4; }

    .tools {
      position: absolute;
      top: 22px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
      max-width: calc(100% - 24px);
      padding: 5px;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 3px 14px #0001;
    }

    .status {
      min-width: 49px;
      text-align: center;
      align-self: center;
      font-size: 12px;
    }

    #link {
      color: #fff;
      background: #3e714c;
      border: 1px solid #356240;
    }

    #link:hover:not(:disabled) { background: #305d3c; }

    #link:disabled {
      opacity: 1;
      color: #607561;
      background: #dce8dc;
      border-color: #cbdacb;
    }

    .creation-tools {
      position: absolute;
      top: 104px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 7px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 3px 15px #0001;
    }

    .creation-tools button { text-align: left; }
    #delete-node { color: #a33535; }
    #compose-card { color: #3d583d; background: #e6ecd9; }

    .palette-panel {
      position: absolute;
      top: 86px;
      right: 16px;
      z-index: 5;
      width: min(300px, calc(100% - 32px));
      padding: 16px;
      border: 1px solid #dfded4;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 24px #0002;
    }

    .palette-panel h2 { margin: 0 0 10px; font-size: 16px; }

    .palette-panel label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .palette-panel textarea {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      border: 1px solid #dfded4;
      border-radius: 10px;
    }

    #wheel {
      display: block;
      width: 84px;
      height: 84px;
      margin-bottom: 8px;
      padding: 0;
      border: 5px solid #f1efe8;
      border-radius: 50%;
      background: conic-gradient(red, #ff0, lime, cyan, blue, magenta, red);
    }

    .notice {
      position: absolute;
      z-index: 6;
      top: 100px;
      left: 50%;
      max-width: 90%;
      padding: 8px 14px;
      border-radius: 15px;
      color: white;
      background: #303928;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    .notice:empty { display: none; }

    .chat {
      position: absolute;
      bottom: 22px;
      left: 50%;
      width: min(760px, calc(100% - 24px));
      border: 1px solid #dfded4;
      border-radius: 23px;
      background: white;
      box-shadow: 0 10px 30px #3b392318;
      transform: translateX(-50%);
    }

    .chathead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-bottom: 1px solid #edece6;
    }

    .chat.collapsed .chathead { border-bottom: 0; }
    #chat-body { overflow: hidden; border-radius: 0 0 23px 23px; }
    #chat-body[hidden] { display: none; }

    #chat-toggle,
    #chat-toggle:hover {
      position: absolute;
      top: -36px;
      left: 50%;
      width: 56px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transform: translateX(-50%);
    }

    .chat-chevron {
      position: relative;
      display: block;
      width: 40px;
      height: 24px;
      margin: auto;
      filter: drop-shadow(0 1px 1px #6b655b55);
    }

    .chat-chevron::before,
    .chat-chevron::after {
      content: "";
      position: absolute;
      top: 5px;
      width: 23px;
      height: 4px;
      border-radius: 999px;
      background: #e9e2d2;
    }

    .chat-chevron::before {
      right: 18px;
      transform: rotate(40deg);
      transform-origin: right center;
    }

    .chat-chevron::after {
      left: 18px;
      transform: rotate(-40deg);
      transform-origin: left center;
    }

    #chat-toggle[aria-expanded="false"] .chat-chevron {
      transform: rotate(180deg);
    }

    #webchat { height: clamp(175px, 27vh, 280px); }
    #connection { margin: 0; padding: 7px 14px; }

    #references {
      padding: 8px 14px;
      border-top: 1px solid #eee;
      font-size: 12px;
    }

    #references summary { color: #596443; cursor: pointer; }
    #reference-list { max-height: 120px; overflow: auto; }

    .reference-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 0;
    }

    .reference-row a {
      overflow: hidden;
      color: #4f6248;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reference-row button {
      padding: 5px 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    #text-editor {
      width: min(360px, 90vw);
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 18px;
    }

    #text-editor::backdrop,
    #composition::backdrop { background: #24291f70; }

    #text-editor textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 12px;
    }

    #composition {
      width: min(800px, 94vw);
      max-height: 90dvh;
      padding: 20px;
      border: 1px solid #deddd3;
      border-radius: 24px;
      color: #282821;
      background: #faf9f4;
    }

    .composition-head,
    .composition-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #composition select {
      margin: 10px;
      padding: 8px;
      border: 1px solid #d5d6ca;
      border-radius: 10px;
      background: white;
    }

    .composition-preview {
      display: flex;
      justify-content: center;
      padding: 16px;
      border-radius: 16px;
      background: #eeede6;
    }

    #composition-canvas {
      display: block;
      max-width: 100%;
      max-height: 53dvh;
      border-radius: 10px;
      object-fit: contain;
      touch-action: none;
      cursor: grab;
    }

    #composition-hint,
    #composition-status {
      color: #62675a;
      font-size: 12px;
    }

    #composition-status { min-height: 18px; }
    #insert-composition { color: white; background: #3e714c; }

    @media (max-width: 700px) {
      header { padding: 0 13px; }
      .top span { display: none; }
      .heading { top: 12px; left: 12px; }
      .tools { top: 82px; right: 10px; }
      .tools button { padding: 6px 8px; }
      .creation-tools { top: 145px; left: 12px; }
      .creation-tools button { padding: 7px; font-size: 12px; }
      .palette-panel { top: 143px; }
    }
  </style>
</head>

<body>
  <header>
    <strong class="logo"><i>✿</i> moodroom</strong>
    <div class="top">
      <span>내 작업공간</span>
      <button id="save">보드 저장</button>
    </div>
  </header>

  <main>
    <div class="heading">
      <b>종이 콜라주</b>
      <small>레퍼런스 보드</small>
    </div>

    <div class="viewport" id="view">
      <div class="stage" id="stage">
        <svg class="lines" id="lines" aria-hidden="true"></svg>
      </div>
    </div>

    <div class="tools">
      <button id="minus" aria-label="축소">−</button>
      <span class="status" id="zoom"></span>
      <button id="plus" aria-label="확대">+</button>
      <button id="fit" aria-label="화면 맞춤">⊡</button>
      <button id="add-search">검색 +</button>
      <button id="palette-toggle" aria-expanded="false">팔레트 +</button>
      <button id="link" type="button" disabled>노드 연결</button>
    </div>

    <div class="creation-tools" aria-label="노드 편집 도구">
      <button id="upload-image" type="button">▧ 이미지 추가</button>
      <button id="write-text" type="button">T 텍스트 추가</button>
      <button id="compose-card" type="button" disabled>▦ 카드 만들기</button>
      <button id="delete-node" type="button" disabled>🗑 삭제</button>
      <input id="upload-files" type="file" accept="image/*" multiple hidden>
    </div>

    <dialog id="text-editor" aria-labelledby="text-editor-label">
      <form id="text-form">
        <label id="text-editor-label" for="node-text">추가할 텍스트</label>
        <textarea id="node-text" required></textarea>
        <button id="cancel-text" type="button">취소</button>
        <button id="submit-text" type="submit">노드 추가</button>
      </form>
    </dialog>

    <dialog id="composition" aria-labelledby="composition-title">
      <div class="composition-head">
        <b id="composition-title">선택한 노드로 카드 만들기</b>
        <button id="close-composition" aria-label="닫기">×</button>
      </div>

      <label>
        비율
        <select id="composition-ratio">
          <option value="1:1">1:1 정사각형</option>
          <option value="4:3">4:3 가로</option>
          <option value="3:4">3:4 세로</option>
          <option value="16:9">16:9 가로</option>
          <option value="9:16">9:16 세로</option>
        </select>
      </label>

      <p id="composition-hint">
        카드를 끌어 위치를 옮기고, 선택한 카드의 오른쪽 아래 점을 끌어
        크기를 조절하세요. 사진 비율은 유지됩니다.
        컬러칩을 클릭하면 상자형 / 세로 컬러보드로 바뀝니다.
      </p>

      <div class="composition-preview">
        <canvas id="composition-canvas" aria-label="묶음 카드 미리보기"></canvas>
      </div>

      <p id="composition-status" role="status"></p>

      <div class="composition-actions">
        <button id="download-composition" disabled>PNG 저장</button>
        <button id="insert-composition" disabled>보드에 카드 추가</button>
      </div>
    </dialog>

    <aside class="palette-panel" id="palette-panel" hidden>
      <h2>팔레트 추가</h2>
      <button id="wheel" aria-label="색상환에서 색 선택"></button>
      <label>
        선택 색상
        <input type="color" id="color-picker" value="#a49a70">
      </label>
      <button id="add-color">선택한 색 추가</button>
      <textarea
        id="agent-colors"
        rows="3"
        aria-label="에이전트의 HEX 코드"
        placeholder="에이전트가 준 HEX 코드 붙여넣기"
      ></textarea>
      <button id="add-agent">코드로 팔레트 만들기</button>
    </aside>

    <div class="notice" id="notice" role="status"></div>

    <section class="chat" aria-label="에이전트 채팅">
      <button
        id="chat-toggle"
        type="button"
        aria-expanded="true"
        aria-controls="chat-body"
        aria-label="채팅 접기"
        title="채팅 접기"
      >
        <span class="chat-chevron" aria-hidden="true"></span>
      </button>

      <div class="chathead"><b>✦ 무드보드 에이전트</b></div>

      <div id="chat-body">
        <p id="connection" role="status">채팅에 연결하는 중입니다…</p>
        <div id="webchat"></div>

        <details id="references" hidden>
          <summary id="reference-count">참고 링크</summary>
          <div id="reference-list"></div>
        </details>
      </div>
    </section>
  </main>

  <script>
    const el = id => document.getElementById(id);
    const stage = el('stage');
    const view = el('view');
    const chatToggle = el('chat-toggle');
    const chatBody = el('chat-body');

    chatToggle.onclick = () => {
      const collapsed = !chatBody.hidden;
      chatBody.hidden = collapsed;
      chatBody.closest('.chat').classList.toggle('collapsed', collapsed);
      chatToggle.setAttribute('aria-expanded', String(!collapsed));
      chatToggle.setAttribute('aria-label', collapsed ? '채팅 펼치기' : '채팅 접기');
      chatToggle.title = collapsed ? '채팅 펼치기' : '채팅 접기';
    };

    const palette = ['#ddc8a3', '#a49a70', '#656d47', '#b66b52', '#e9dfc9'];

    let cards = [
      {
        id: 0, x: 400, y: 153, type: '탐색 키워드',
        title: 'Paper collage', desc: '종이 콜라주', root: true
      },
      {
        id: 1, x: 104, y: 44, type: '이미지',
        title: '겹쳐 붙인 종이', desc: '찢어진 가장자리 · 빈티지 · 질감',
        art: 'art',
        url: 'https://www.metmuseum.org/art/collection/search?q=paper%20collage'
      },
      {
        id: 2, x: 681, y: 31, type: '이미지',
        title: '유기적인 형태', desc: '종이 콜라주 · 추상 · 올리브',
        art: 'art alt',
        url: 'https://www.tate.org.uk/art/art-terms/c/collage'
      },
      {
        id: 3, x: 695, y: 277, type: '글',
        title: '콜라주 기법', desc: '종이 조각을 재배치해 만드는 시각적 구성',
        url: 'https://www.tate.org.uk/art/art-terms/c/collage'
      },
      {
        id: 4, x: 116, y: 288, type: '팔레트',
        title: '따뜻한 종이 톤', desc: '베이지 · 올리브 · 테라코타',
        colors: palette
      }
    ];

    let edges = [[0, 1], [0, 2], [0, 3], [0, 4]];
    let next = 5;

    try {
      const saved = JSON.parse(localStorage.getItem('moodroom'));
      if (saved) ({ cards, edges, next } = saved);
    } catch {}

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let drag = null;
    let timer;
    let directLine;
    let paletteMerging = false;
    let placement = 0;

    const chosen = new Set();
    const localImports = new Map();
    const requestContexts = new Map();
    const latestRequestByNode = new Map();
    const referenceLinks = new Map();
    const messageVersions = new Map();
    const importedMessageKeys = new Set(
      cards.map(card => card.originKey).filter(Boolean)
    );

    function notify(message) {
      el('notice').textContent = message;
      clearTimeout(timer);
      timer = setTimeout(() => el('notice').textContent = '', 4300);
    }

    function make(tag, content = '', className = '') {
      const node = document.createElement(tag);
      node.textContent = content || '';
      if (className) node.className = className;
      return node;
    }

    function transform() {
      stage.style.transform =
        'translate(calc(-50% + ' + panX + 'px),calc(-50% + ' + panY +
        'px)) scale(' + scale + ')';
      el('zoom').textContent = Math.round(scale * 100) + '%';
    }

    function fit() {
      scale = Math.min(
        1,
        view.clientWidth / 920,
        Math.max(.3, (view.clientHeight - 330) / 440)
      );
      panX = 0;
      panY = 0;
      transform();
    }

    function lines() {
      const paths = edges.map(([from, to]) => {
        const first = cards.find(card => card.id === from);
        const second = cards.find(card => card.id === to);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

        const x = first.x + (first.root ? 95 : 107);
        const y = first.y + 52;
        const endX = second.x + 107;
        const endY = second.y + 52;
        const middle = (x + endX) / 2;

        path.setAttribute(
          'd',
          `M${x} ${y} C${middle} ${y} ${middle} ${endY} ${endX} ${endY}`
        );
        path.setAttribute('stroke', '#a5a990');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('fill', 'none');
        return path;
      });
      el('lines').replaceChildren(...paths);
    }

    function render() {
      stage.querySelectorAll('.card').forEach(card => card.remove());

      for (const card of cards) {
        const box = make(
          'article',
          '',
          'card' + (card.root ? ' root' : '') +
          (chosen.has(card.id) ? ' selected' : '')
        );

        box.dataset.id = card.id;
        if (card.type === '키워드') box.dataset.text = '';
        if (card.composite) box.dataset.composite = '';
        box.style.left = card.x + 'px';
        box.style.top = card.y + 'px';
        box.tabIndex = 0;

        box.append(make('div', card.type, 'type'));

        if (card.art) box.append(make('div', '', card.art));

        if (card.image) {
          const image = make('img');
          image.draggable = false;
          image.src = card.image;
          image.alt = card.title;
          image.onload = lines;
          image.onerror = () => {
            image.classList.add('failed');
            image.after(make('p', '이미지를 불러오지 못했어요. 원본 출처를 확인해 주세요.'));
            lines();
          };
          box.append(image);
        }

        if (card.colors) {
          const swatches = make('div', '', 'swatches');
          swatches.style.setProperty('--chip-columns', String(Math.min(3, card.colors.length)));
          swatches.style.setProperty('--color-count', String(card.colors.length));

          box.dataset.palette = '';
          box.dataset.colorLayout = card.colorLayout === 'bars' ? 'bars' : 'boxes';

          for (const color of card.colors) {
            const unit = make('div', '', 'swatch-unit');
            const button = make('button', '', 'swatch-color');

            button.style.background = color;
            button.title = '클릭하면 상자형 / 세로 컬러보드 전환';
            button.setAttribute('aria-label', color + ' 모양 전환');

            button.onkeydown = event => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                event.stopPropagation();
                togglePaletteLayout(card);
                render();
              }
            };

            unit.append(button, make('span', color, 'swatch-code'));
            swatches.append(unit);
          }

          const search = make('button', '색으로 검색', 'palette-search');
          search.onclick = () => searchColors(card);
          box.append(swatches, search);
        }

        box.append(make('h2', card.title), make('p', card.desc));

        if (card.url) {
          const anchor = make('a', '참고 출처 ↗');
          anchor.href = card.url;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          box.append(anchor);
        }

        if (card.pending) {
          const accept = make('button', '수락');
          const remove = make('button', '삭제');

          accept.onclick = () => {
            card.pending = false;
            render();
          };
          remove.onclick = () => {
            cards = cards.filter(item => item.id !== card.id);
            edges = edges.filter(pair => !pair.includes(card.id));
            chosen.delete(card.id);
            render();
          };
          box.append(accept, remove);
        }

        if (card.search) {
          const refresh = make('button', '↻ 연결 정보로 검색');
          refresh.onclick = () => searchColors(card);
          box.append(refresh);
        }

        if (card.image && card.localImage) {
          const send = make('button', '이미지 채팅에 보내기');
          send.onclick = () => {
            if (!window.moodChatStore) {
              notify('채팅 연결을 기다려 주세요.');
              return;
            }
            window.moodChatStore.dispatch({
              type: 'WEB_CHAT/SEND_FILES',
              payload: {
                files: [{
                  name: card.title,
                  size: card.imageSize || 0,
                  url: card.image
                }]
              }
            });
            if (chatBody.hidden) chatToggle.click();
          };
          box.append(send);
        }

        box.onpointerdown = event => {
          if (event.target.closest('a,button') && !event.target.closest('.swatches')) return;
          event.stopPropagation();
          start(event, card, box);
        };

        box.onkeydown = event => {
          if (event.target === box && (event.key === 'Enter' || event.key === ' ')) {
            event.preventDefault();
            chooseNode(card.id);
          }
        };

        stage.append(box);
      }

      lines();
      refreshSelection();
    }

    function start(event, card, box) {
      if (event.button !== 0 || paletteMerging) return;
      view.setPointerCapture(event.pointerId);
      drag = {
        c: card,
        box,
        x: event.clientX,
        y: event.clientY,
        ox: card ? card.x : panX,
        oy: card ? card.y : panY,
        moved: false,
        colorFace: !!event.target.closest('.swatch-color')
      };
    }

    view.onpointerdown = event => {
      if (!event.target.closest('.card')) start(event);
    };

    view.onpointermove = event => {
      if (!drag) return;
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      if (Math.hypot(dx, dy) > 4) drag.moved = true;
      if (!drag.moved) return;

      if (drag.c) {
        drag.c.x = drag.ox + dx / scale;
        drag.c.y = drag.oy + dy / scale;
        drag.box.style.left = drag.c.x + 'px';
        drag.box.style.top = drag.c.y + 'px';
        lines();
      } else {
        panX = drag.ox + dx;
        panY = drag.oy + dy;
        transform();
      }
    };

    view.onpointercancel = () => drag = null;

    view.onpointerup = event => {
      const finished = drag;
      drag = null;
      if (!finished) return;

      if (finished.moved) {
        mergePalette(finished);
        return;
      }

      if (finished.c?.colors && finished.colorFace) {
        togglePaletteLayout(finished.c);
        chosen.add(finished.c.id);
        render();
      } else if (finished.c) {
        chooseNode(finished.c.id);
      } else {
        chosen.clear();
        refreshSelection();
      }
    };

    function chooseNode(id) {
      if (chosen.has(id)) chosen.delete(id);
      else chosen.add(id);
      refreshSelection();
    }

    function selectedConnection() {
      if (chosen.size !== 2) return false;
      const [a, b] = [...chosen];
      return edges.some(([from, to]) =>
        (from === a && to === b) || (from === b && to === a)
      );
    }

    function refreshSelection() {
      for (const box of stage.querySelectorAll('.card')) {
        box.classList.toggle('selected', chosen.has(Number(box.dataset.id)));
      }

      const connected = selectedConnection();
      el('link').disabled = chosen.size < 2;
      el('link').textContent = connected
        ? '노드 해제'
        : chosen.size >= 2
          ? '선택한 노드 연결 (' + chosen.size + ')'
          : '노드 연결';

      el('link').title = connected ? '선택한 두 노드의 연결 해제' : '선택한 노드 연결';
      el('compose-card').disabled = chosen.size === 0;
      el('delete-node').disabled = chosen.size === 0;
      el('delete-node').textContent = chosen.size ? '🗑 삭제 (' + chosen.size + ')' : '🗑 삭제';
    }

    el('link').onclick = () => {
      const ids = [...chosen].filter(id => cards.some(card => card.id === id));
      if (ids.length < 2) return;

      if (selectedConnection()) {
        const [a, b] = ids;
        edges = edges.filter(([from, to]) =>
          !((from === a && to === b) || (from === b && to === a))
        );
        render();
        notify('두 노드의 연결을 해제했어요.');
        return;
      }

      const anchor = ids[0];
      for (const id of ids.slice(1)) {
        if (!edges.some(pair => pair.includes(anchor) && pair.includes(id))) {
          edges.push([anchor, id]);
        }
      }
      render();
      notify('선택한 노드를 연결했어요.');
    };

    el('delete-node').onclick = () => {
      const count = chosen.size;
      if (!count) return;

      cards = cards.filter(card => !chosen.has(card.id));
      edges = edges.filter(([a, b]) => !chosen.has(a) && !chosen.has(b));
      chosen.clear();
      localImports.clear();

      render();
      renderReferences();
      notify(count + '개 노드를 삭제했어요.');
    };

    function zoom(amount) {
      scale = Math.min(2, Math.max(.25, scale + amount));
      transform();
    }

    el('plus').onclick = () => zoom(.1);
    el('minus').onclick = () => zoom(-.1);
    el('fit').onclick = fit;

    view.onwheel = event => {
      event.preventDefault();
      zoom(event.deltaY < 0 ? .07 : -.07);
    };

    window.addEventListener('resize', fit);

    el('save').onclick = () => {
      try {
        localStorage.setItem('moodroom', JSON.stringify({ cards, edges, next }));
        notify('이 브라우저에 보드를 저장했어요.');
      } catch {

    function nextPosition() {
      const slot = placement++ % 9;
      return {
        x: 300 - panX / scale + (slot % 3) * 130,

    const palettePanel = el('palette-panel');

    el('palette-toggle').onclick = () => {

      el('palette-toggle').setAttribute('aria-expanded', String(!palettePanel.hidden));

    function readColors(value) {
      const matches = value.match(/#[0-9a-f]{6}(?![a-z0-9])|#[0-9a-f]{3}(?![a-z0-9])/gi) || [];
      return [...new Set(matches.map(hex => {
        hex = hex.toUpperCase();
        return hex.length === 4
          ? '#' + [...hex.slice(1)].map(character => character + character).join('')
          : hex;
      }))];
    }

    function addPalette(colors, title) {
      if (!colors.length) {
        notify('HEX 코드(예: #A49A70)를 입력해 주세요.');
        return;
      }
      cards.push({
        id: next++,

      });

      render();
    }

    function addColorChips(colors, originKey = '') {
      if (!colors.length) return;
      for (const color of colors) {
        cards.push({
          id: next++,
          ...nextPosition(),
          type: '팔레트',
          title: color,
          desc: '',
          colors: [color],
          originKey
        });
      }
      render();
      notify(colors.length + '개 컬러칩을 만들었어요.');
    }

    el('wheel').onclick = event => {
      if (!event.detail) {
        el('color-picker').click();
        return;
      }

      const bounds = event.currentTarget.getBoundingClientRect();
      const hue = (
        Math.atan2(
          event.clientX - bounds.left - bounds.width / 2,
          bounds.top + bounds.height / 2 - event.clientY
        ) * 180 / Math.PI + 360
      ) % 360;

      const channel = number => {
        const part = (number + hue / 30) % 12;
        return Math.round(
          255 * (.5 - .5 * Math.max(-1, Math.min(part - 3, 9 - part, 1)))
        ).toString(16).padStart(2, '0');
      };

      el('color-picker').value = '#' + channel(0) + channel(8) + channel(4);
    };

    el('add-color').onclick = () =>
      addPalette(readColors(el('color-picker').value), '선택한 색');

    el('add-agent').onclick = () =>
      addColorChips(readColors(el('agent-colors').value));

    function togglePaletteLayout(card) {
      card.colorLayout = card.colorLayout === 'bars' ? 'boxes' : 'bars';
    }

    async function mergePalette(finished) {
      if (!finished.c?.colors || paletteMerging) return;
      const source = finished.c;

      const target = [...stage.querySelectorAll('.card')].reverse()
        .map(box => ({
          box,
          card: cards.find(card => card.id === Number(box.dataset.id))
        }))
        .find(({ box, card }) => {
          if (!card?.colors || card.id === source.id) return false;

          const targetBounds = box.getBoundingClientRect();
          const sourceBounds = finished.box.getBoundingClientRect();
          const snap = 12 * scale;

          return sourceBounds.left <= targetBounds.right + snap &&
            sourceBounds.right >= targetBounds.left - snap &&
            sourceBounds.top <= targetBounds.bottom + snap &&
            sourceBounds.bottom >= targetBounds.top - snap;
        })?.card;

      if (!target) return;

      await animatePaletteMerge(
        finished.box,
        stage.querySelector('[data-id="' + target.id + '"]'),
        source,
        target
      );

      if (!cards.includes(source) || !cards.includes(target)) return;

      target.colors = readColors([...target.colors, ...source.colors].join(' '));
      cards = cards.filter(card => card.id !== source.id);

      const seen = new Set();
      edges = edges
        .map(pair => pair.map(id => id === source.id ? target.id : id))
        .filter(([a, b]) => {
          const key = [Math.min(a, b), Math.max(a, b)].join(':');
          if (a === b || seen.has(key)) return false;
          seen.add(key);
          return true;
        });

      if (chosen.delete(source.id)) chosen.add(target.id);
      render();

      const mergedBox = stage.querySelector('[data-id="' + target.id + '"]');
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        mergedBox.animate(
          [
            { transform: 'scale(.98)', borderRadius: '24px' },
            { transform: 'scale(1)', borderRadius: '30px' }
          ],
          { duration: 140, easing: 'ease-out' }
        );
      }
      notify('팔레트를 합쳤어요.');
    }

    async function animatePaletteMerge(sourceBox, targetBox, source, target) {
      paletteMerging = true;

      const sw = sourceBox.offsetWidth;
      const sh = sourceBox.offsetHeight;
      const tw = targetBox.offsetWidth;
      const th = targetBox.offsetHeight;

      const centerX = source.x + sw / 2 - target.x - tw / 2;
      const centerY = source.y + sh / 2 - target.y - th / 2;
      const horizontal = Math.abs(centerX) / (sw + tw) >= Math.abs(centerY) / (sh + th);

      let x = target.x;
      let y = target.y;
      let sourceRadius;
      let targetRadius;

      if (horizontal) {
        const left = centerX < 0;
        x = left ? target.x - sw : target.x + tw;
        y = target.y + (th - sh) / 2;
        sourceRadius = left ? '30px 0 0 30px' : '0 30px 30px 0';
        targetRadius = left ? '0 30px 30px 0' : '30px 0 0 30px';
      } else {
        const above = centerY < 0;
        y = above ? target.y - sh : target.y + th;
        x = target.x + (tw - sw) / 2;
        sourceRadius = above ? '30px 30px 0 0' : '0 0 30px 30px';
        targetRadius = above ? '0 0 30px 30px' : '30px 30px 0 0';
      }

      const move = `translate(${x - source.x}px,${y - source.y}px)`;
      const duration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 440;
      const options = {
        duration,
        easing: 'cubic-bezier(.22,.7,.3,1)',
        fill: 'forwards'
      };

      sourceBox.classList.add('merging');
      targetBox.classList.add('merging');

      try {
        await Promise.all([
          sourceBox.animate([
            { transform: 'translate(0,0)', borderRadius: '30px', opacity: 1 },
            { transform: move, borderRadius: sourceRadius, opacity: 1, offset: .65 },
            { transform: move, borderRadius: sourceRadius, opacity: 0 }
          ], options).finished,

          targetBox.animate([
            { borderRadius: '30px' },
            { borderRadius: targetRadius, offset: .65 },
            { borderRadius: targetRadius }
          ], options).finished
        ]);
      } catch {
        // 화면 갱신으로 애니메이션이 취소되어도 데이터 병합은 이어갑니다.
      } finally {
        sourceBox.classList.remove('merging');
        targetBox.classList.remove('merging');
        paletteMerging = false;
      }
    }

    el('write-text').onclick = () => {
      el('node-text').value = '';
      el('node-text').setCustomValidity('');
      el('text-editor').showModal();
      el('node-text').focus();
    };

    el('cancel-text').onclick = () => el('text-editor').close();
    el('node-text').oninput = () => el('node-text').setCustomValidity('');

    el('text-form').onsubmit = event => {
      event.preventDefault();

      const input = el('node-text');
      const text = input.value.trim();

      if (!text) {
        input.setCustomValidity('노드에 넣을 글을 입력해 주세요.');
        input.reportValidity();
        return;
      }

      const bounds = stage.getBoundingClientRect();
      const viewportBounds = view.getBoundingClientRect();
      const chatBounds = document.querySelector('.chat').getBoundingClientRect();
      const visibleBottom = Math.min(viewportBounds.bottom, chatBounds.top - 40);
      const centerX = (viewportBounds.left + viewportBounds.right) / 2;
      const centerY = (viewportBounds.top + visibleBottom) / 2;

      const card = {
        id: next++,
        x: (centerX - bounds.left) / scale - 107,
        y: (centerY - bounds.top) / scale - 45,
        type: '키워드',
        title: text,
        desc: ''
      };

      cards.push(card);
      chosen.clear();
      chosen.add(card.id);
      render();
      el('text-editor').close();
      stage.querySelector('[data-id="' + card.id + '"]').focus({ preventScroll: true });
      notify('텍스트 노드를 추가했어요.');
    };

    function readImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function importImages(files) {
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;

        const key = file.name + ':' + file.size + ':' + file.lastModified;
        if (localImports.has(key)) continue;
        localImports.set(key, true);

        try {
          const image = await readImageFile(file);
          cards.push({
            id: next++,
            ...nextPosition(),
            type: '이미지',
            title: file.name,
            desc: '',
            image,
            imageSize: file.size,
            localImage: true
          });
          render();
        } catch {
          localImports.delete(key);
          notify(file.name + ' 이미지를 읽지 못했어요.');
        }
      }
    }

    el('upload-image').onclick = () => el('upload-files').click();

    el('upload-files').onchange = event => {
      importImages([...event.target.files]);
      event.target.value = '';
    };

    el('webchat').addEventListener('change', event => {
      if (event.target.type === 'file') importImages([...event.target.files]);
    }, true);

    el('webchat').addEventListener('drop', event => {
      if (event.dataTransfer?.files.length) {
        importImages([...event.dataTransfer.files]);
      }
    }, true);

    el('webchat').addEventListener('paste', event => {
      if (event.clipboardData?.files.length) {
        importImages([...event.clipboardData.files]);
      }
    }, true);

    function collectConnected(id) {
      const visited = new Set([id]);
      const queue = [id];

      for (let index = 0; index < queue.length; index++) {
        for (const [a, b] of edges) {
          const neighbor = a === queue[index] ? b : b === queue[index] ? a : null;
          if (neighbor !== null && !visited.has(neighbor)) {
            visited.add(neighbor);
            queue.push(neighbor);
          }
        }
      }

      return cards.filter(card => visited.has(card.id) && !card.search).map(card => ({
        id: card.id,
        type: card.type,
        title: card.title,
        keywords: card.keywords?.length ? card.keywords : (card.desc || ''),
        description: card.desc || '',
        colors: card.colors || [],
        source: card.url || '',
        imageUrl: safeImageUrl(card.image),
        contents: card.sourceNodes || []
      }));
    }

    function searchColors(card) {
      if (!directLine) {
        notify('에이전트 채팅 연결을 확인해 주세요.');
        return;
      }

      const nodes = collectConnected(card.id);
      if (!nodes.length) {
        notify('검색 노드에 참고 노드를 연결하세요.');
        return;
      }

      const requestId = crypto.randomUUID();
      requestContexts.set(requestId, { anchor: card.id, done: false });
      latestRequestByNode.set(card.id, requestId);

      const schema = {
        requestId,
        searchNodeId: card.id,
        results: [{
          type: 'image 또는 paper 또는 article 또는 video',
          title: '제목',
          imageUrl: null,
          sourceUrl: '확인된 원본 URL',
          authors: [],
          year: null,
          summary: '한 줄 요약',
          reason: '추천 이유',
          keywords: []
        }],
        references: [{ title: '추가 참고 링크 제목', url: 'URL' }]
      };

      const text =
        '연결된 모든 노드의 제목·키워드·색상·출처를 반영해 실제 자료를 검색해 주세요. ' +
        '논문은 저자·연도·요약을 포함하고, 이미지 주소는 실제 이미지 URL만 넣어 주세요. ' +
        '확인되지 않은 링크를 만들지 마세요. 최신 nodes를 사용하세요. ' +
        '결과는 다음 JSON 구조의 코드 블록으로 반환하고 requestId와 searchNodeId를 그대로 복사해 주세요.\n' +
        JSON.stringify(schema) + '\n검색 조건: ' + JSON.stringify({ nodes });

      window.moodChatStore.dispatch({
        type: 'WEB_CHAT/SEND_MESSAGE',
        payload: { text }
      });

      notify('연결된 ' + nodes.length + '개 노드의 정보로 검색을 요청했어요.');
    }

    el('add-search').onclick = () => {
      cards.push({
        id: next++,
        search: true,
        x: 500 - panX / scale,
        y: 220 - panY / scale,
        type: '검색',
        title: '연결된 레퍼런스 검색',
        desc: '참고 노드를 연결하고 새로고침하세요.'
      });
      render();
    };

    function safeImageUrl(value) {
      if (typeof value !== 'string') return null;
      try {
        const url = new URL(value);
        return ['https:', 'http:'].includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    }

    function canonicalUrl(value) {
      const safe = safeImageUrl(value);
      if (!safe) return null;

      const url = new URL(safe);
      url.hash = '';

      for (const key of [...url.searchParams.keys()]) {
        if (/^utm_|^(fbclid|gclid)$/i.test(key)) url.searchParams.delete(key);
      }
      return url.href;
    }

    function resultIdentity(result) {
      return canonicalUrl(
        result.sourceUrl || result.url || result.link || result.imageUrl
      );
    }

    function extractLinks(text) {
      const found = new Map();

      const add = (label, value, image = false) => {
        const url = safeImageUrl(value.replace(/&amp;/g, '&'));
        if (!url) return;

        const existing = found.get(url);
        found.set(url, {
          url,
          title: label || existing?.title || new URL(url).hostname,
          image: image || existing?.image ||
            /\.(png|jpe?g|webp|gif|avif)(?:[?#]|$)/i.test(url)
        });
      };

      for (const match of text.matchAll(/(!?)\[([^\]]*)\]\(<?(https?:\/\/[^\s)>]+)>?(?:\s+"[^"]*")?\)/g)) {
        add(match[2], match[3], match[1] === '!');
      }

      for (const match of text.matchAll(/https?:\/\/[^\s<>"\]\)]+/g)) {
        add('', match[0].replace(/[.,;]+$/, ''));
      }

      return [...found.values()];
    }

    function readResultPayload(text) {
      const candidates = [...text.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)]
        .map(match => match[1]);

      candidates.push(text.trim());

      const first = text.indexOf('{');
      const last = text.lastIndexOf('}');
      if (first >= 0 && last > first) candidates.push(text.slice(first, last + 1));

      for (const candidate of candidates) {
        try {
          const parsed = JSON.parse(candidate);
          if (parsed && (
            Array.isArray(parsed.results) || Array.isArray(parsed.papers)
          )) return parsed;
        } catch {}
      }

      return null;
    }

    function plainTextResults(text) {
      const results = [];
      const chunks = text.split(
        /(?=^(?:#{1,4}\s+|\s*\d+[.)]\s+|\s*(?:추천 이미지|논문 제목)\s*[:：]))/m
      );

      for (const chunk of chunks) {
        const links = extractLinks(chunk);
        const images = links.filter(link => link.image);

        const directImageLine = chunk.match(
          /(?:다이렉트 이미지 링크|직접 이미지 (?:주소|링크)|imageUrl)[ \t]*[:：]?[ \t]*(?:\r?\n[ \t]*)?([^\r\n]+)/i
        );

        if (directImageLine) {
          for (const link of extractLinks(directImageLine[1])) {
            if (!images.some(image => image.url === link.url)) {
              images.push({ ...link, image: true });
            }
          }
        }

        const sourceLine = chunk.match(
          /(?:원본 출처|원본 링크|출처|sourceUrl)\s*[:：]?\s*([^\n]*(?:\n[^\n]+)?)/i
        );

        const source = sourceLine
          ? extractLinks(sourceLine[1]).find(link => !link.image)
          : null;

        const titleLine = chunk.split('\n').map(line => line.trim()).find(Boolean) || '';
        const title = titleLine
          .replace(/^[#\s\d.)*-]+/, '')
          .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/\*\*/g, '');

        const summary = chunk.match(
          /(?:한 줄 요약|요약|추천 이유)\s*[:：]\s*([^\n]+)/
        )?.[1] || '';

        const paper = /(?:논문|저자\s*[:：]|authors?\s*[:：])/i.test(chunk) ||
          (/파악한 주제|논문 목록/.test(text) && /\d{4}/.test(chunk));

        if (images.length) {
          for (const image of images) {
            results.push({
              type: 'image',
              title: image.title === new URL(image.url).hostname
                ? (title || '추천 이미지')
                : image.title,
              imageUrl: image.url,
              sourceUrl: source?.url || null,
              reason: summary
            });
          }
        } else if (paper) {
          const candidate = source || links.find(link => !link.image);
          if (candidate) {
            results.push({
              type: 'paper',
              title: candidate.title === new URL(candidate.url).hostname
                ? (title || '관련 논문')
                : candidate.title,
              sourceUrl: candidate.url,
              reason: summary,
              authors: chunk.match(
                /(?:저자|authors?)\s*[:：]\s*([^\n]+)/i
              )?.[1] || '',
              year: chunk.match(
                /(?:연도|year)\s*[:：]\s*(\d{4})/i
              )?.[1] || ''
            });
          }
        } else if (
          !/참고 링크|추가 참고|더 알아보기/.test(titleLine) &&
          (
            /추천 이유|자료 유형/.test(chunk) ||
            /검색 결과|추천 자료|추천 레퍼런스|관련 글|관련 영상/.test(text)
          )
        ) {
          const candidate = source || links.find(link => !link.image);
          if (candidate) {
            results.push({
              type: /영상|비디오/.test(chunk) ? 'video' : 'article',
              title: candidate.title === new URL(candidate.url).hostname
                ? (title || '추천 자료')
                : candidate.title,
              sourceUrl: candidate.url,
              reason: summary
            });
          }
        }
      }

      return results;
    }

    function resultContext(payload) {
      if (payload?.requestId && requestContexts.has(payload.requestId)) {
        const request = requestContexts.get(payload.requestId);
        return {
          ...request,
          stale: latestRequestByNode.get(request.anchor) !== payload.requestId
        };
      }

      if (payload?.searchNodeId != null) {
        const anchor = cards.find(card =>
          String(card.id) === String(payload.searchNodeId)
        );
        if (anchor) return { anchor: anchor.id };
      }

      const pending = [...requestContexts.entries()]
        .filter(([id, request]) =>
          !request.done && latestRequestByNode.get(request.anchor) === id
        )
        .map(([, request]) => request);

      return pending.length === 1 ? pending[0] : {};
    }

    function upsertResult(result, originKey, context = {}) {
      const image = safeImageUrl(result.imageUrl);
      const source = safeImageUrl(result.sourceUrl || result.url || result.link);
      if (!image && !source) return null;

      const identity = canonicalUrl(source || image);

      let card = cards.find(item =>
        item.resultKey === identity ||
        (source && canonicalUrl(item.url) === canonicalUrl(source)) ||
        (image && canonicalUrl(item.image) === canonicalUrl(image))
      );

      const type = result.type || (image ? 'image' : 'article');
      const labels = {
        image: '이미지',
        paper: '논문',
        article: '글',
        video: '영상',
        statistics: '통계'
      };

      const authors = Array.isArray(result.authors)
        ? result.authors.join(', ')
        : result.authors || result.author || '';

      const metadata = [authors, result.year].filter(Boolean).join(' · ');
      const description = [
        metadata,
        result.reason || result.summary || result.description
      ].filter(Boolean).join('\n');

      if (!card) {
        const anchor = cards.find(item => item.id === context.anchor);
        const count = cards.filter(item =>
          item.resultAnchor === context.anchor && context.anchor != null
        ).length;

        const position = anchor
          ? {
              x: anchor.x + 270 + (count % 3) * 235,
              y: anchor.y + Math.floor(count / 3) * 250
            }
          : nextPosition();

        card = {
          id: next++,
          ...position,
          type: labels[type] || '자료',
          title: String(result.title || '추천 자료'),
          desc: description,
          url: source,
          image,
          originKey,
          resultKey: identity,
          resultAnchor: context.anchor,
          keywords: result.keywords || result.tags || []
        };
        cards.push(card);
      } else {
        if (image) card.image = image;
        if (source) card.url = source;
        if (description) card.desc = description;
        if (result.title) card.title = String(result.title);
      }

      if (
        context.anchor != null &&
        cards.some(item => item.id === context.anchor) &&
        card.id !== context.anchor &&
        !edges.some(pair => pair.includes(card.id) && pair.includes(context.anchor))
      ) {
        edges.push([context.anchor, card.id]);
      }

      for (const [key, reference] of referenceLinks) {
        if ([identity, canonicalUrl(image), canonicalUrl(source)].includes(key)) {
          reference.added = true;
        }
      }

      return card;
    }

    function addReference(link, context, originKey) {
      const key = canonicalUrl(link.url);
      if (!key || referenceLinks.has(key)) return;
      referenceLinks.set(key, { ...link, context, originKey });
    }

    function renderReferences() {
      const container = el('reference-list');
      container.replaceChildren();
      el('references').hidden = referenceLinks.size === 0;
      el('reference-count').textContent = '참고 링크 ' + referenceLinks.size;

      for (const reference of referenceLinks.values()) {
        reference.added = cards.some(card =>
          canonicalUrl(card.url) === canonicalUrl(reference.url) ||
          canonicalUrl(card.image) === canonicalUrl(reference.url)
        );

        const row = make('div', '', 'reference-row');
        const anchor = make('a', reference.title);
        anchor.href = reference.url;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';

        const button = make('button', reference.added ? '추가됨' : '＋ 추가');
        button.type = 'button';
        button.disabled = !!reference.added;

        button.onclick = () => {
          upsertResult(
            { title: reference.title, sourceUrl: reference.url, type: 'article' },
            reference.originKey,
            reference.context
          );
          reference.added = true;
          render();
          renderReferences();
        };

        row.append(anchor, button);
        container.append(row);
      }
    }

    function receiveActivity(activity) {
      if (!['message', 'messageUpdate'].includes(activity.type)) return;

      const key = activity.id || JSON.stringify([
        activity.timestamp,
        activity.from,
        activity.text
      ]);

      const fingerprint = JSON.stringify([activity.text, activity.attachments]);
      if (messageVersions.get(key) === fingerprint) return;

      const firstInSession = !messageVersions.has(key);
      messageVersions.set(key, fingerprint);

      if (firstInSession && importedMessageKeys.has(key)) return;

      if (activity.from?.role === 'bot') {
        const text = activity.text || '';
        const payload = readResultPayload(text);
        const context = resultContext(payload);

        const results = payload
          ? (
              Array.isArray(payload.results)
                ? payload.results
                : payload.papers.map(paper => ({ ...paper, type: 'paper' }))
            )
          : plainTextResults(text);

        const used = new Set();
        const added = [];

        for (const result of results.filter(result => result && typeof result === 'object')) {
          const identity = resultIdentity(result);

          if (context.stale) {
            if (identity) {
              addReference(
                { url: identity, title: result.title || '이전 검색 결과' },
                {},
                key
              );
            }
            continue;
          }

          const card = upsertResult(result, key, context);
          if (card) added.push(card.id);

          for (const url of [
            result.sourceUrl, result.url, result.link, result.imageUrl
          ]) {
            const normalized = canonicalUrl(url);
            if (normalized) used.add(normalized);
          }
        }

        for (const reference of payload?.references || []) {
          const url = safeImageUrl(reference.url || reference.sourceUrl);
          if (url) {
            addReference(
              { url, title: reference.title || new URL(url).hostname },
              context,
              key
            );
            used.add(canonicalUrl(url));
          }
        }

        for (const link of extractLinks(text)) {
          if (used.has(canonicalUrl(link.url))) continue;

          if (link.image && !context.stale) {
            upsertResult(
              { type: 'image', title: link.title, imageUrl: link.url },
              key,
              context
            );
          } else {
            addReference(link, context.stale ? {} : context, key);
          }
        }

        const colorText = payload ? '' : text.replace(/https?:\/\/\S+/g, '');
        const colors = readColors(colorText).filter(color =>
          !cards.some(card => card.originKey === key && card.colors?.includes(color))
        );

        if (colors.length) addColorChips(colors, key);

        if (added.length && context.anchor != null) {
          for (const request of requestContexts.values()) {
            if (request.anchor === context.anchor) request.done = true;
          }
        }

        renderReferences();
      }

      for (const attachment of activity.attachments || []) {
        if (!attachment.contentType?.startsWith('image/')) continue;

        const image = safeImageUrl(attachment.contentUrl);
        if (!image) continue;

        if (cards.some(card =>
          card.image === image ||
          (card.localImage && card.title === attachment.name)
        )) continue;

        upsertResult(
          {
            type: 'image',
            title: attachment.name || '채팅 이미지',
            imageUrl: image
          },
          key
        );
      }

      render();
    }

    function orderedGroups(items, connections) {
      const remaining = new Set(items.map(item => item.id));
      const byId = new Map(items.map(item => [item.id, item]));
      const groups = [];

      for (const item of items) {
        if (!remaining.delete(item.id)) continue;

        const group = [item];
        for (let index = 0; index < group.length; index++) {
          for (const [a, b] of connections) {
            const neighbor = a === group[index].id
              ? b
              : b === group[index].id ? a : null;

            if (remaining.delete(neighbor)) group.push(byId.get(neighbor));
          }
        }
        groups.push(group);
      }

      const result = [];
      let cursor = items[0];

      while (groups.length) {
        const connected = groups.some(group => group.length > 1);
        const candidates = groups.filter(group => !connected || group.length > 1);

        candidates.sort((a, b) =>
          Math.min(...a.map(card => Math.hypot(card.x - cursor.x, card.y - cursor.y))) -
          Math.min(...b.map(card => Math.hypot(card.x - cursor.x, card.y - cursor.y)))
        );

        const group = candidates[0];
        result.push(group);
        groups.splice(groups.indexOf(group), 1);
        cursor = group[group.length - 1];
      }

      return result;
    }

    function tileWeight(card) {
      return card.image || card.art ? 3 : card.colors ? 1.4 : 2;
    }

    function partitionTiles(items, box, weight) {
      if (items.length === 1) return [{ ...box, item: items[0] }];

      const total = items.reduce((sum, item) => sum + weight(item), 0);
      let leftWeight = weight(items[0]);
      let split = 1;

      while (split < items.length - 1 && leftWeight < total / 2) {
        leftWeight += weight(items[split++]);
      }

      const fraction = leftWeight / total;
      const first = { ...box };
      const second = { ...box };

      if (box.w >= box.h) {
        first.w = box.w * fraction;
        second.x += first.w;
        second.w -= first.w;
      } else {
        first.h = box.h * fraction;
        second.y += first.h;
        second.h -= first.h;
      }

      return [
        ...partitionTiles(items.slice(0, split), first, weight),
        ...partitionTiles(items.slice(split), second, weight)
      ];
    }

    function paletteMetrics(card) {
      const bars = card.colorLayout === 'bars';
      const count = card.colors.length;
      const columns = bars ? count : Math.min(3, count);
      const rows = Math.ceil(count / columns);
      const swatchW = bars ? 64 : 72;
      const swatchH = bars ? 160 : 72;
      const gap = bars ? 0 : 8;
      const padding = 10;
      const labelHeight = 24;

      const cells = card.colors.map((color, index) => ({
        color,
        x: padding + (index % columns) * (swatchW + gap),
        y: padding + Math.floor(index / columns) * (swatchH + labelHeight + gap),
        w: swatchW,
        h: swatchH,
        labelHeight
      }));

      return {
        w: padding * 2 + columns * swatchW + (columns - 1) * gap,
        h: padding * 2 + rows * (swatchH + labelHeight) + (rows - 1) * gap,
        cells
      };
    }

    function textMetrics(context, text, maxWidth) {
      const fontSize = 28;
      const lineHeight = 38;
      const padding = 16;
      context.font = fontSize + 'px "Malgun Gothic", sans-serif';

      const textLines = [];

      for (const paragraph of String(text).split('\n')) {
        let line = '';
        for (const character of paragraph) {
          if (line && context.measureText(line + character).width > maxWidth) {
            textLines.push(line);
            line = character;
          } else {
            line += character;
          }
        }
        textLines.push(line);
      }

      const width = Math.max(
        1,
        ...textLines.map(line => context.measureText(line).width)
      );

      return {
        lines: textLines,
        fontSize,
        lineHeight,
        padding,
        w: width + padding * 2,
        h: textLines.length * lineHeight + padding * 2
      };
    }

    function drawPaletteTile(context, tile) {
      const metrics = paletteMetrics(tile.item);
      const factor = tile.w / metrics.w;

      context.save();
      context.translate(tile.x, tile.y);
      context.scale(factor, factor);
      context.fillStyle = '#fff';
      context.beginPath();
      context.roundRect(0, 0, metrics.w, metrics.h, 15);
      context.fill();

      for (const [index, cell] of metrics.cells.entries()) {
        context.fillStyle = cell.color;
        context.beginPath();

        const corners = tile.item.colorLayout === 'bars'
          ? [
              index === 0 ? 12 : 0,
              index === metrics.cells.length - 1 ? 12 : 0,
              index === metrics.cells.length - 1 ? 12 : 0,
              index === 0 ? 12 : 0
            ]
          : 12;

        context.roundRect(cell.x, cell.y, cell.w, cell.h, corners);
        context.fill();

        context.font = '11px monospace';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillStyle = '#41483a';
        context.fillText(
          cell.color,
          cell.x + cell.w / 2,
          cell.y + cell.h + cell.labelHeight / 2
        );
      }

      context.restore();
    }

    function drawTextTile(context, tile) {
      const metrics = tile.textLayout ||
        textMetrics(context, tile.item.title, Math.max(20, tile.w - 32));

      const factor = tile.w / metrics.w;

      context.save();
      context.translate(tile.x, tile.y);
      context.scale(factor, factor);
      context.fillStyle = '#fff';
      context.beginPath();
      context.roundRect(0, 0, metrics.w, metrics.h, 14);
      context.fill();

      context.fillStyle = '#30352b';
      context.font = metrics.fontSize + 'px "Malgun Gothic", sans-serif';
      context.textAlign = 'left';
      context.textBaseline = 'middle';

      metrics.lines.forEach((line, index) => {
        context.fillText(
          line,
          metrics.padding,
          metrics.padding + (index + .5) * metrics.lineHeight
        );
      });

      context.restore();
    }

    function compositionLayout(items, connections, width, height, images = new Map()) {
      if (!items.length) return [];

      const groups = orderedGroups(items, connections);
      const margin = 36;

      const blocks = partitionTiles(
        groups,
        {
          x: margin,
          y: margin,
          w: width - margin * 2,
          h: height - margin * 2
        },
        group => group.reduce((sum, card) => sum + tileWeight(card), 0)
      );

      const measureContext = document.createElement('canvas').getContext('2d');

      return blocks
        .flatMap(block => partitionTiles(block.item, block, tileWeight))
        .map(tile => {
          const image = images.get(tile.item.id);
          const roomW = Math.max(1, tile.w - 18);
          const roomH = Math.max(1, tile.h - 18);

          let naturalW;
          let naturalH;
          let textLayout;

          if (tile.item.colors?.length) {
            const metrics = paletteMetrics(tile.item);
            naturalW = metrics.w;
            naturalH = metrics.h;
          } else if (!image && !tile.item.art) {
            textLayout = textMetrics(
              measureContext,
              tile.item.title,
              Math.max(30, roomW - 32)
            );
            naturalW = textLayout.w;
            naturalH = textLayout.h;
          } else {
            const ratio = image ? image.width / image.height : 1.6;
            const border = .035 * Math.min(ratio, 1);
            naturalW = (ratio + border * 2) * 300;
            naturalH = (1 + border * 2) * 300;
          }

          const factor = Math.min(
            roomW / naturalW,
            roomH / naturalH,
            textLayout ? 1 : Infinity
          );

          const w = naturalW * factor;
          const h = naturalH * factor;

          return {
            ...tile,
            x: tile.x + (tile.w - w) / 2,
            y: tile.y + (tile.h - h) / 2,
            w,
            h,
            textLayout
          };
        });
    }

    function loadCompositionImage(source) {
      return new Promise((resolve, reject) => {
        const image = new Image();

        if (!source.startsWith('data:') && !source.startsWith('blob:')) {
          image.crossOrigin = 'anonymous';
        }

        const timeout = setTimeout(() => {
          image.src = '';
          reject(new Error('이미지 불러오기 시간 초과'));
        }, 10000);

        image.onload = () => {
          clearTimeout(timeout);
          resolve(image);
        };

        image.onerror = () => {
          clearTimeout(timeout);
          reject(new Error('이미지 접근 제한'));
        };

        image.src = source;
      });
    }

    function drawTile(context, tile, image) {
      if (tile.item.colors?.length) {
        drawPaletteTile(context, tile);
        return;
      }

      if (!image && !tile.item.art) {
        drawTextTile(context, tile);
        return;
      }

      const { item: card, x, y, w, h } = tile;
      const border = Math.min(w, h) * .035 / 1.07;
      const innerX = x + border;
      const innerY = y + border;
      const innerW = w - border * 2;
      const innerH = h - border * 2;
      const radius = Math.min(22, Math.min(w, h) * .075);

      context.save();
      context.shadowColor = '#38352218';
      context.shadowBlur = 12;
      context.shadowOffsetY = 4;
      context.fillStyle = '#fff';
      context.beginPath();
      context.roundRect(x, y, w, h, radius);
      context.fill();

      context.shadowColor = 'transparent';
      context.beginPath();
      context.roundRect(innerX, innerY, innerW, innerH, Math.max(1, radius - border));
      context.clip();

      context.fillStyle = '#f3f1e9';
      context.fillRect(innerX, innerY, innerW, innerH);

      if (image) {
        const factor = Math.min(innerW / image.width, innerH / image.height);
        context.drawImage(
          image,
          innerX + (innerW - image.width * factor) / 2,
          innerY + (innerH - image.height * factor) / 2,
          image.width * factor,
          image.height * factor
        );
      } else {
        const gradient = context.createLinearGradient(
          innerX, innerY, innerX + innerW, innerY + innerH
        );
        gradient.addColorStop(0, '#dfc598');
        gradient.addColorStop(.55, '#a49a70');
        gradient.addColorStop(1, '#596442');

        context.fillStyle = gradient;
        context.fillRect(innerX, innerY, innerW, innerH);
        context.fillStyle = '#b66b52';
        context.beginPath();
        context.moveTo(innerX, innerY + innerH * .4);
        context.lineTo(innerX + innerW * .7, innerY + innerH);
        context.lineTo(innerX, innerY + innerH);
        context.fill();
      }

      context.restore();
    }

    let compositionItems = [];
    let compositionEdges = [];
    let compositionRevision = 0;
    let compositionReady = false;
    let compositionTiles = [];
    let compositionImages = new Map();
    let compositionActive = null;
    let compositionDrag = null;

    const compositionCanvas = el('composition-canvas');

    function paintComposition(canvas, showSelection = false) {
      const context = canvas.getContext('2d');
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#f7f5ee';
      context.fillRect(0, 0, canvas.width, canvas.height);

      for (const tile of compositionTiles) {
        drawTile(context, tile, compositionImages.get(tile.item.id));
      }

      if (!showSelection) return;

      const active = compositionTiles.find(tile => tile.item.id === compositionActive);
      if (!active) return;

      const pixel = canvas.width / Math.max(1, canvas.getBoundingClientRect().width);
      context.save();
      context.strokeStyle = '#587749';
      context.lineWidth = 2 * pixel;
      context.strokeRect(active.x, active.y, active.w, active.h);
      context.fillStyle = '#fff';
      context.beginPath();
      context.arc(active.x + active.w, active.y + active.h, 6 * pixel, 0, Math.PI * 2);
      context.fill();
      context.stroke();
      context.restore();
    }

    function exportCompositionCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = compositionCanvas.width;
      canvas.height = compositionCanvas.height;
      paintComposition(canvas);
      return canvas;
    }

    function constrainTile(tile, width, height) {
      const factor = Math.min(1, (width - 24) / tile.w, (height - 24) / tile.h);
      tile.w *= factor;
      tile.h *= factor;
      tile.x = Math.min(Math.max(12, tile.x), width - tile.w - 12);
      tile.y = Math.min(Math.max(12, tile.y), height - tile.h - 12);
    }

    async function refreshComposition() {
      const revision = ++compositionRevision;
      compositionReady = false;
      compositionDrag = null;

      el('download-composition').disabled = true;
      el('insert-composition').disabled = true;
      el('composition-status').textContent = '원본 사진 비율로 배치하는 중…';

      const [rw, rh] = el('composition-ratio').value.split(':').map(Number);
      const width = Math.round(1600 * rw / Math.max(rw, rh));
      const height = Math.round(1600 * rh / Math.max(rw, rh));

      const loaded = await Promise.all(compositionItems.map(async card => {
        if (!card.image) return { id: card.id };

        try {
          return {
            id: card.id,
            image: compositionImages.get(card.id) ||
              await loadCompositionImage(card.image)
          };
        } catch {
          return { id: card.id, failed: true, title: card.title };
        }
      }));

      if (revision !== compositionRevision) return;

      compositionImages = new Map(loaded.map(item => [item.id, item.image]));

      if (compositionTiles.length) {
        const oldWidth = compositionCanvas.width;
        const oldHeight = compositionCanvas.height;
        const factor = Math.min(width / oldWidth, height / oldHeight);

        for (const tile of compositionTiles) {
          tile.x = (tile.x - oldWidth / 2) * factor + width / 2;
          tile.y = (tile.y - oldHeight / 2) * factor + height / 2;
          tile.w *= factor;
          tile.h *= factor;
          constrainTile(tile, width, height);
        }
      } else {
        compositionTiles = compositionLayout(
          compositionItems,
          compositionEdges,
          width,
          height,
          compositionImages
        );
      }

      compositionCanvas.width = width;
      compositionCanvas.height = height;

      const previewWidth = Math.min(
        width,
        Math.max(180, el('composition').clientWidth - 74),
        window.innerHeight * .53 * width / height
      );

      compositionCanvas.style.width = previewWidth + 'px';
      compositionCanvas.style.height = previewWidth * height / width + 'px';
      paintComposition(compositionCanvas, true);

      const failed = loaded.filter(item => item.failed);
      if (failed.length) {
        el('composition-status').textContent =
          '불러오지 못한 이미지: ' + failed.map(item => item.title).join(', ') +
          '. 파일로 올려 다시 선택해 주세요.';
        return;
      }

      compositionReady = true;
      el('download-composition').disabled = false;
      el('insert-composition').disabled = false;
      el('composition-status').textContent =
        compositionItems.length + '개 선택 · ' + width + ' × ' + height +
        ' px · 원본 사진 비율 유지';
    }

    function compositionPoint(event) {
      const bounds = compositionCanvas.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left) * compositionCanvas.width / bounds.width,
        y: (event.clientY - bounds.top) * compositionCanvas.height / bounds.height
      };
    }

    function resizeCompositionTile(tile, original, point, width, height) {
      const dx = point.x - original.pointerX;
      const dy = point.y - original.pointerY;
      const ratio = original.w / original.h;
      const projection =
        (dx * original.w + dy * original.h) /
        (original.w ** 2 + original.h ** 2);

      const maxWidth = Math.min(width - tile.x - 12, (height - tile.y - 12) * ratio);
      const minWidth = Math.min(maxWidth, Math.max(40, 40 * ratio));

      tile.w = Math.max(minWidth, Math.min(maxWidth, original.w * (1 + projection)));
      tile.h = tile.w / ratio;
    }

    compositionCanvas.onpointerdown = event => {
      if (event.button !== 0 || !compositionReady) return;

      const point = compositionPoint(event);
      const active = compositionTiles.find(tile => tile.item.id === compositionActive);
      const tolerance =
        14 * compositionCanvas.width / compositionCanvas.getBoundingClientRect().width;

      const resizing = active &&
        Math.hypot(point.x - active.x - active.w, point.y - active.y - active.h) <= tolerance;

      const tile = resizing
        ? active
        : [...compositionTiles].reverse().find(tile =>
            point.x >= tile.x && point.x <= tile.x + tile.w &&
            point.y >= tile.y && point.y <= tile.y + tile.h
          );

      compositionActive = tile?.item.id ?? null;

      if (tile) {
        compositionTiles = compositionTiles.filter(item => item !== tile);
        compositionTiles.push(tile);

        compositionDrag = {
          tile,
          resizing,
          moved: false,
          pointerId: event.pointerId,
          x: tile.x,
          y: tile.y,
          w: tile.w,
          h: tile.h,
          pointerX: point.x,
          pointerY: point.y
        };

        compositionCanvas.setPointerCapture(event.pointerId);
        compositionCanvas.style.cursor = resizing ? 'nwse-resize' : 'grabbing';
      }

      paintComposition(compositionCanvas, true);
      event.preventDefault();
    };

    compositionCanvas.onpointermove = event => {
      const current = compositionDrag;
      if (!current || current.pointerId !== event.pointerId) return;

      const point = compositionPoint(event);
      const threshold =
        4 * compositionCanvas.width / compositionCanvas.getBoundingClientRect().width;

      if (Math.hypot(point.x - current.pointerX, point.y - current.pointerY) > threshold) {
        current.moved = true;
      }
      if (!current.moved) return;

      if (current.resizing) {
        resizeCompositionTile(
          current.tile, current, point,
          compositionCanvas.width, compositionCanvas.height
        );
      } else {
        current.tile.x = current.x + point.x - current.pointerX;
        current.tile.y = current.y + point.y - current.pointerY;
        constrainTile(current.tile, compositionCanvas.width, compositionCanvas.height);
      }

      paintComposition(compositionCanvas, true);
    };

    function finishCompositionDrag(event) {
      if (compositionDrag?.pointerId !== event.pointerId) return;
      const finished = compositionDrag;

      if (
        event.type === 'pointerup' &&
        !finished.moved &&
        !finished.resizing &&
        finished.tile.item.colors?.length
      ) {
        const tile = finished.tile;
        const previous = paletteMetrics(tile.item);
        const factor = tile.w / previous.w;

        togglePaletteLayout(tile.item);

        const metrics = paletteMetrics(tile.item);
        tile.w = metrics.w * factor;
        tile.h = metrics.h * factor;
        constrainTile(tile, compositionCanvas.width, compositionCanvas.height);
        paintComposition(compositionCanvas, true);
      }

      compositionDrag = null;
      compositionCanvas.style.cursor = 'grab';

      if (compositionCanvas.hasPointerCapture(event.pointerId)) {
        compositionCanvas.releasePointerCapture(event.pointerId);
      }
    }

    compositionCanvas.onpointerup = finishCompositionDrag;
    compositionCanvas.onpointercancel = finishCompositionDrag;
    compositionCanvas.onlostpointercapture = () => {
      compositionDrag = null;
      compositionCanvas.style.cursor = 'grab';
    };

    el('compose-card').onclick = () => {
      compositionItems = cards
        .filter(card => chosen.has(card.id))
        .map(card => ({
          ...card,
          colors: card.colors ? [...card.colors] : undefined
        }));

      if (!compositionItems.length) return;

      const ids = new Set(compositionItems.map(card => card.id));
      compositionEdges = edges
        .filter(([a, b]) => ids.has(a) && ids.has(b))
        .map(pair => [...pair]);

      compositionTiles = [];
      compositionActive = null;
      compositionDrag = null;

      el('composition').showModal();
      refreshComposition();
    };

    el('composition-ratio').onchange = refreshComposition;
    el('close-composition').onclick = () => el('composition').close();

    el('composition').addEventListener('close', () => {
      compositionRevision++;
      compositionReady = false;
      compositionDrag = null;
    });

    el('download-composition').onclick = () => {
      if (!compositionReady) return;

      const exportCanvas = exportCompositionCanvas();
      const ratioLabel = el('composition-ratio').value.replace(':', 'x');

      exportCanvas.toBlob(blob => {
        if (!blob) {
          notify('PNG를 만들지 못했어요.');
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'moodroom-' + ratioLabel + '.png';
        link.click();

        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }, 'image/png');
    };

    el('insert-composition').onclick = () => {
      if (!compositionReady) return;

      const id = next++;
      cards.push({
        id,
        ...nextPosition(),
        type: '묶음 카드',
        title: '무드보드 카드',
        desc: compositionItems.length + '개 노드 · ' + el('composition-ratio').value,
        image: exportCompositionCanvas().toDataURL('image/png'),
        composite: true,
        sourceNodes: compositionItems.map(card => ({
          id: card.id,
          title: card.title,
          colors: card.colors || [],
          source: card.url || ''
        }))
      });

      chosen.clear();
      chosen.add(id);
      render();
      el('composition').close();
      notify('선택한 노드로 묶음 카드를 만들었어요.');
    };

    fit();
    render();
  </script>
